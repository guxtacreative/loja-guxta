<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Relatório mensal · Hub de Marketing</title>
<link rel="icon" type="image/png" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="tema-claro.css">
<link rel="stylesheet" href="componentes.css">
<style>
  body{padding-block:24px 64px}
  .wrap{max-width:900px;gap:28px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#FFFFFF}
  .toolbar p{margin:0;font-size:14px;color:var(--muted);max-width:52ch}
  .brandbar .logo{height:48px}
  @page{size:A4;margin:14mm 12mm}
  @media print{
    html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{padding:0;font-size:12.5px}
    .no-print{display:none!important}
    .wrap{max-width:none;gap:18px}
    .relatorio{gap:18px}
    .relatorio .sec{break-inside:auto}
    .relatorio .sec>h2{break-after:avoid}
    .card,.kpi,.peca,.chart,table.bal tr{break-inside:avoid}
    .quebra{break-before:page}
    .relatorio .capa{min-height:0}
    .table-scroll,.chart-scroll{overflow:visible}
    table.bal,table.ads{min-width:0}
    .kpis{grid-template-columns:repeat(3,1fr)}
    .relatorio .grade{grid-template-columns:repeat(4,1fr)}
    a{color:inherit;text-decoration:none}
    :root{--bg:#FFFFFF}
    .card,.post,.kpi,.peca{box-shadow:none}
    body{background:#FFFFFF}
    .relatorio .sec>h2,h1,h2,h3{line-height:1.15;padding-top:4px}
  }
</style>
<link rel="stylesheet" href="japy-tema.css">
</head>
<body>
<div class="wrap">
  <div class="toolbar no-print">
    <p id="dica">Confira o relatório e clique em <b>Salvar em PDF</b>. Na janela que abrir, escolha <b>Salvar como PDF</b> e deixe marcado <b>Gráficos de fundo</b>.</p>
    <div class="actions"><a class="btn small" href="admin.html" id="voltar">Voltar ao painel</a><button class="btn primary" id="pdf" disabled>Salvar em PDF</button></div>
  </div>

  <div id="erro" class="empty" hidden></div>
  <div id="rel" class="relatorio" hidden></div>
</div>

<script src="config.js"></script>
<script src="metricas.js"></script>
<script src="anuncios.js"></script>
<script src="relatorio.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const urlSupabase=u=>{u=String(u||"").trim();let m=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);if(m)return "https://"+m[1]+".supabase.co";m=u.match(/^(?:https?:\/\/)?([a-z0-9-]+\.supabase\.(?:co|in))/i);if(m)return "https://"+m[1].toLowerCase();return u.replace(/\/+$/,"")};
  const cfg=window.GLARA_CONFIG||{}, MARCA=cfg.marca||"GUXTA";
  const erro=m=>{$("#erro").textContent=m;$("#erro").hidden=false};

  const q=new URLSearchParams(location.search);
  const cicloId=q.get("ciclo"), token=q.get("c")||"", clienteQ=q.get("cliente")||"";
  const modoCliente=!!(token||clienteQ);
  if(!cicloId){erro("Abra o relatório pelo painel, no mês desejado (aba Relatório).");return}
  if(!window.supabase||!cfg.supabaseUrl||/SEU-PROJETO/.test(cfg.supabaseUrl)){erro("O site ainda não foi configurado (config.js).");return}
  const sb=window.supabase.createClient(urlSupabase(cfg.supabaseUrl),String(cfg.supabaseAnonKey||"").trim(),
    modoCliente?{auth:{persistSession:!token,storageKey:"guxta-cliente",detectSessionInUrl:false,autoRefreshToken:!token}}:{});
  if(modoCliente){const v=$("#voltar");v.textContent="Voltar ao Hub";v.href="index.html"+(token?"?c="+encodeURIComponent(token):"");
    $("#dica").innerHTML="Clique em <b>Salvar em PDF</b>. Na janela que abrir, escolha <b>Salvar como PDF</b> e deixe marcado <b>Gráficos de fundo</b>.";}

  async function carregarCliente(){
    const {data,error}=await sb.rpc("portal_relatorio",{p_token:token||null,p_ciclo:cicloId,p_cliente:clienteQ||null});
    if(error){erro("Não conseguimos carregar o relatório agora. Tente de novo.");return}
    if(!data){erro(token?"Este relatório não está disponível.":"Entre no Hub com seu e-mail e senha e abra o relatório de novo pela aba Relatório.");return}
    const D=window.GlaraRelatorio.doPortal(data);
    try{const v=await sb.rpc("portal_verba",{p_token:token||null,p_cliente:clienteQ||null});D.verba=v&&!v.error&&v.data&&v.data.ativa?v.data:null}catch(_){}
    montar(D);
  }

  async function carregar(){
    if(modoCliente)return carregarCliente();
    const {data:{session}}=await sb.auth.getSession();
    if(!session){erro("Entre no painel primeiro (admin.html) e abra o relatório de novo por lá.");return}
    const c=await sb.from("ciclos").select("*").eq("id",cicloId).single();
    if(c.error||!c.data){erro("Não encontrei este mês. Abra o relatório pelo painel.");return}
    const ciclo=c.data;
    const [cl,ps,rs,ss,pd,ad,cs]=await Promise.all([
      sb.from("clientes").select("*").eq("id",ciclo.cliente_id).single(),
      sb.from("posts").select("*").eq("ciclo_id",cicloId).order("dia",{nullsFirst:false}).order("data",{nullsFirst:false}),
      sb.from("roteiros").select("id").eq("ciclo_id",cicloId),
      sb.from("stories").select("id").eq("ciclo_id",cicloId),
      sb.from("pedidos").select("*").eq("ciclo_id",cicloId).order("criado_em"),
      sb.from("anuncios").select("*").eq("ciclo_id",cicloId).order("data"),
      sb.from("ciclos").select("*").eq("cliente_id",ciclo.cliente_id)]);
    const falhou=[cl,ps,rs,ss,pd,ad,cs].find(x=>x.error);if(falhou){erro("Não consegui carregar tudo: "+falhou.error.message);return}
    const posts=ps.data, ids=posts.map(p=>p.id);
    const dc=ids.length?await sb.from("decisoes").select("*").in("post_id",ids):{data:[]};
    const dec={};(dc.data||[]).forEach(d=>dec[d.post_id]=d);
    let verba=null;if(cl.data.verba_ativa){try{const v=await sb.rpc("verba_admin",{p_cliente:ciclo.cliente_id});verba=v.error?null:v.data}catch(_){}}
    montar({ciclo,cliente:cl.data,posts,dec,nRoteiros:rs.data.length,nStories:ss.data.length,pedidos:pd.data,anuncios:ad.data,ciclos:cs.data,verba});
  }

  function montar(D){
    if(/^#[0-9a-f]{6}$/i.test(D.cliente.cor_destaque||"")&&!["#FF6B2C","#FF6B2C","#FF6B2C","#C0703A","#3D4BFF","#0F8A4A","#0866FF","#1877F2"].includes(String(D.cliente.cor_destaque).toUpperCase()))document.documentElement.style.setProperty("--accent",D.cliente.cor_destaque);
    document.title=`Relatório ${D.cliente.nome} · ${D.ciclo.titulo}`;
    $("#rel").innerHTML=window.GlaraRelatorio.html(D,{marca:MARCA,plataforma:cfg.plataforma});
    $("#rel").hidden=false;$("#pdf").disabled=false;
  }

  $("#pdf").addEventListener("click",()=>{
    // espera as imagens antes de imprimir
    const imgs=[...document.images].filter(i=>!i.complete);
    Promise.all(imgs.map(i=>new Promise(r=>{i.onload=i.onerror=r}))).then(()=>window.print());
  });
  carregar();
})();
</script>
<script src="ajuste-cores.js"></script>
</body>
</html>
