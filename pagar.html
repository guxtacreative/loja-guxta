<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pagamento</title>
<link rel="icon" type="image/png" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="tema-claro.css">
<link rel="stylesheet" href="tema-escuro.css">
<link rel="stylesheet" href="componentes.css">
<link rel="stylesheet" href="leve.css">
<script src="tema.js"></script>
<style>
  .pgp{max-width:820px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
  .pgp-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pgp-top .logo{height:40px;width:auto;max-width:none}
  .pgp-hero{border-radius:24px;padding:26px 24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sombra);color:var(--ink)}
  .pgp-hero .eyebrow{color:var(--muted);margin:0}
  .pgp-hero h1{margin:6px 0 4px;font-size:clamp(26px,5vw,36px);line-height:1.1;letter-spacing:-.02em;color:var(--ink)}
  .pgp-hero p{margin:0;color:var(--muted)}
  .pgp-lista{display:flex;flex-direction:column;gap:14px}
  .pgp-rodape{color:var(--muted);font-size:13px;text-align:center;margin-top:6px}
  .pgp-seg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
</style>
<link rel="stylesheet" href="japy-tema.css">
</head>
<body>
<div class="pgp">
  <div class="pgp-top"><img class="logo" src="logo.png" alt="GUXTA" onerror="this.remove()"><button type="button" class="tema-btn" data-tema-btn></button></div>
  <header class="pgp-hero"><p class="eyebrow" id="pgp-emp">Pagamento</p><h1 id="pgp-tit">Carregando…</h1><p id="pgp-sub"></p></header>
  <div class="pg-faixa" id="pg-faixa" hidden role="status" aria-live="polite"></div>
  <main class="pgp-lista pg-painel" id="pgp-lista" aria-live="polite"></main>
  <p class="pgp-rodape"><span class="pgp-seg"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Pagamento seguro. O cartão é processado pelo Mercado Pago; não guardamos dados do seu cartão.</span></p>
</div>
<div class="toast" id="toast" hidden role="status" style="position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--on-brand,#fff);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:90vw"></div>

<script src="config.js"></script>
<script src="pagamentos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const cfg=window.GLARA_CONFIG||{};
  const urlSupabase=u=>{u=String(u||"").trim();let m=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);if(m)return "https://"+m[1]+".supabase.co";m=u.match(/^(?:https?:\/\/)?([a-z0-9-]+\.supabase\.(?:co|in))/i);if(m)return "https://"+m[1].toLowerCase();return u.replace(/\/+$/,"")};
  let tT=null;const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3200)};
  const token=new URLSearchParams(location.search).get("t")||"";
  const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  if(!window.supabase||!cfg.supabaseUrl||!/^[0-9a-f-]{36}$/i.test(token)){
    $("#pgp-tit").textContent="Link de pagamento inválido";$("#pgp-sub").textContent="Confira o endereço que você recebeu ou fale com a gente.";return}
  const sb=window.supabase.createClient(urlSupabase(cfg.supabaseUrl),String(cfg.supabaseAnonKey||"").trim());
  const mod=window.GlaraPagamentos.criar({sb,fonte:"publico",token,banner:$("#pg-faixa"),panel:$("#pgp-lista"),toast,
    abrir:()=>{const c=document.querySelector(".pg-card");c&&c.scrollIntoView({behavior:"smooth",block:"start"})},
    carregou:D=>{
      if(!D){$("#pgp-tit").textContent="Cobrança não encontrada";$("#pgp-sub").textContent="O link pode ter sido trocado. Fale com a gente para receber um novo.";document.title="Pagamento";return}
      const it=D.itens[0], emp=(D.config&&D.config.empresa)||cfg.marca||"";
      $("#pgp-emp").textContent=emp?emp+" · pagamento":"Pagamento";
      $("#pgp-tit").textContent=it.descricao;
      $("#pgp-sub").textContent=it.status==="pago"?"Pagamento confirmado. Obrigado!":(D.cliente?D.cliente+" · ":"")+"Vencimento "+String(it.data).split("-").reverse().join("/")+" · "+brl(it.atualizado?it.atualizado.total:it.valor);
      document.title=(emp?emp+" · ":"")+it.descricao;
      const q=new URLSearchParams(location.search);if(q.get("status")==="approved"||q.get("collection_status")==="approved")toast("Pagamento aprovado! Em alguns minutos a baixa aparece aqui.");
    }});
  mod.carregar();
})();
</script>
<script src="ajuste-cores.js"></script>
</body>
</html>
