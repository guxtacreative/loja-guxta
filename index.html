<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loja</title>
<meta name="description" content="Material gráfico com arte, impressão e entrega. Escolha, envie sua arte e pague online.">
<link rel="icon" type="image/png" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{--red:#E30613;--red-d:#B8000E;--ink:#111111;--muted:#6B6B6B;--line:#E6E6E6;--soft:#F5F5F5;--ok:#19A33B;--bg:#F2F2F2;--surface:#FFFFFF;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);-webkit-text-size-adjust:100%}
  a{color:inherit}
  button{font:inherit;color:inherit}
  .cta{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0A0A0A 0%,#1A0003 55%,#5C0008 100%);color:#fff;border-radius:18px;padding:24px}
  .cta h2{color:#fff;margin:4px 0 6px;font-size:22px}
  .cta p{margin:0;color:#D6D6D6;max-width:620px}
  .cta-b{display:flex;flex-wrap:wrap;gap:10px}
  .cta-b .b:not(.pri){background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
  [hidden]{display:none!important}
  .topo{background:linear-gradient(135deg,#0A0A0A 0%,#1A0003 55%,#5C0008 100%);color:#fff;padding:18px 16px 70px}
  .topo-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .topo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .topo img{height:42px;width:auto;display:block}
  .nome-emp{font:900 22px var(--font)}
  .eyebrow{font:800 11px var(--font);letter-spacing:.16em;text-transform:uppercase;color:#FF6B73;margin:0}
  .topo h1{margin:4px 0 0;font:900 clamp(28px,5vw,42px)/1.06 var(--font);letter-spacing:-.02em}
  .topo p.lead{margin:8px 0 0;color:#D6D6D6;max-width:620px}
  .carrinho-btn{position:relative;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
  .carrinho-btn .n{background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px}
  main{max-width:1080px;margin:-46px auto 0;padding:0 16px 120px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--surface);border-radius:18px;padding:20px;box-shadow:0 18px 40px -28px rgba(0,0,0,.35);border:1px solid var(--line)}
  .filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
  .chip[aria-pressed="true"]{border-color:var(--red);color:var(--red);background:#FFF5F5}
  .busca{flex:1 1 220px;min-width:0;font:500 15px var(--font);padding:10px 14px;border:1.5px solid #D4D4D4;border-radius:999px;min-height:42px}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .prod{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .15s,box-shadow .15s}
  .prod:hover{transform:translateY(-2px);box-shadow:0 16px 30px -22px rgba(0,0,0,.45)}
  .prod:focus-visible{outline:3px solid rgba(227,6,19,.4);outline-offset:2px}
  .foto{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto .ini{width:64px;height:64px;border-radius:18px;background:var(--red);color:#fff;display:grid;place-items:center;font:900 24px var(--font)}
  .prod-c{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
  .prod-c small.cat{color:var(--red);font:800 10.5px var(--font);letter-spacing:.12em;text-transform:uppercase}
  .prod-c b{font-size:16px;line-height:1.3}
  .prod-c p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
  .prod-c .apartir{margin-top:8px;font-size:13px;color:var(--muted)}
  .prod-c .apartir strong{display:block;color:var(--ink);font-size:19px;font-weight:800}
  .vazio{text-align:center;color:var(--muted);padding:30px 10px}
  /* diálogos */
  dialog{border:0;border-radius:20px;padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);color:var(--ink)}
  dialog::backdrop{background:rgba(10,10,10,.55)}
  .dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
  .dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 10px}
  .dlg-h h2{margin:0;font:800 20px/1.25 var(--font)}
  .dlg-b{padding:0 20px 14px;overflow:auto}
  .dlg-f{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#fff}
  .x{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
  .m2-campos{display:grid;grid-template-columns:1fr auto 1fr 1fr;gap:10px;align-items:end}
  .m2-x{padding-bottom:14px;font-weight:800;color:var(--muted)}
  .prod-c .apartir strong small{font-size:13px;font-weight:600;color:var(--muted)}
  .faixas{display:flex;flex-direction:column;gap:8px;margin:12px 0}
  .faixa{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
  .faixa input{width:20px;height:20px;accent-color:var(--red);margin:0}
  .faixa.on{border-color:var(--red);background:#FFF5F5}
  .faixa b{font-size:15px}
  .faixa .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .faixa .v small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .info{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13.5px}
  .b{appearance:none;border:1.5px solid #D4D4D4;background:#fff;color:var(--ink);font:700 15px var(--font);padding:12px 20px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
  .b.pri{background:var(--red);border-color:var(--red);color:#fff}
  .b.pri:hover{background:var(--red-d)}
  .b.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .b[disabled]{opacity:.5;cursor:not-allowed}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;font:500 14px var(--font);cursor:pointer;padding:8px 4px}
  .itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .itens li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .itens li:last-child{border-bottom:0}
  .itens small{color:var(--muted);font-size:13px}
  .itens .v{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tirar{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:2px 0;justify-self:end}
  .tot{display:flex;justify-content:space-between;align-items:baseline;background:var(--red);color:#fff;border-radius:12px;padding:12px 16px;margin-top:10px}
  .tot span{font:800 11px var(--font);letter-spacing:.14em;text-transform:uppercase}
  .tot b{font:900 24px var(--font)}
  .linhas{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:14px}
  .linhas div{display:flex;justify-content:space-between;gap:10px}
  /* barra do carrinho (celular) */
  .barra{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -10px 30px -20px rgba(0,0,0,.4);z-index:5}
  .barra-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .barra-in span{font-size:14px;color:var(--muted)}
  .barra-in b{display:block;color:var(--ink);font-size:18px}
  /* checkout */
  .passos{display:grid;gap:4px;list-style:none;margin:0;padding:0;counter-reset:p}
  .passos li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:600 12px var(--font);color:var(--muted);position:relative}
  .passos li::before{counter-increment:p;content:counter(p);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:#fff;color:var(--muted);font:800 13px var(--font);position:relative;z-index:1}
  .passos li::after{content:"";position:absolute;top:15px;left:calc(50% + 17px);right:calc(-50% + 17px);height:2px;background:var(--line)}
  .passos li:last-child::after{display:none}
  .passos li.feito{color:var(--ink)}
  .passos li.feito::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
  .passos li.feito::after{background:var(--ok)}
  .passos li.atual{color:var(--ink)}
  .passos li.atual::before{border-color:var(--red);color:var(--red);box-shadow:0 0 0 4px rgba(227,6,19,.15)}
  h2{margin:0 0 4px;font:800 20px/1.25 var(--font);letter-spacing:-.01em}
  .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
  label{display:block;font:600 13px var(--font);margin:0 0 6px}
  input[type=text],input[type=email],input[type=tel],input[type=search],textarea{width:100%;font:500 16px var(--font);padding:12px 14px;border:1.5px solid #D4D4D4;border-radius:12px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .campos .largo{grid-column:1/-1}
  .campos .cid{display:grid;grid-template-columns:1fr 76px;gap:12px}
  .h3{margin:6px 0 0;font:800 10.5px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
  .dica{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;min-height:1em}
  .check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px;font-weight:400}
  .check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--red);flex:none}
  .acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
  .erro{color:var(--red);font-size:14px;margin:10px 0 0;min-height:1em}
  .opcoes{display:flex;flex-direction:column;gap:10px}
  .opc{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;margin:0;font-weight:400}
  .opc input{grid-row:1/span 2;width:20px;height:20px;margin:1px 0 0;accent-color:var(--red)}
  .opc.on{border-color:var(--red);background:#FFF5F5}
  .opc-t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:15px}
  .opc-v{font-weight:800;white-space:nowrap}
  .opc-v.gratis{color:var(--ok)}
  .opc small{grid-column:2;color:var(--muted);font-size:13px;line-height:1.45}
  .arte-it{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .arte-it + .arte-it{margin-top:10px}
  .arte-it h3{margin:0;font:800 15px var(--font)}
  .arte-it .opcoes{flex-direction:row;flex-wrap:wrap}
  .arte-it .opc{flex:1 1 200px}
  .envio{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:12px;padding:12px}
  .envio .ok{color:#0E7A2A;font-weight:600;font-size:14px}
  .envio small{color:var(--muted);font-size:12.5px}
  .aviso{background:#FFF7E6;border:1px solid #F5C26B;border-radius:12px;padding:12px 14px;font-size:14px}
  .rodape{text-align:center;color:var(--muted);font-size:12.5px;padding:10px 16px 30px}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;max-width:90vw}
  @media (max-width:600px){.m2-campos{grid-template-columns:1fr auto 1fr}.m2-campos>div:last-child{grid-column:1/-1}.card{padding:16px}.campos{grid-template-columns:1fr}.passos li{font-size:10px}.grade{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .prod-c{padding:10px 12px 12px}.prod-c b{font-size:14.5px}.prod-c p{display:none}.prod-c .apartir strong{font-size:16px}.dlg-f .b{flex:1 1 auto}.acoes .b{flex:1 1 auto}}
</style>
</head>
<body>
<header class="topo"><div class="topo-in">
  <div class="topo-bar"><div id="logo"><img src="logo-escuro.png" alt="" onerror="this.parentNode.innerHTML='<span class=nome-emp>GUXTA</span>'"></div>
    <button type="button" class="carrinho-btn" id="btn-carrinho" aria-label="Abrir o carrinho"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"/></svg>Carrinho <span class="n" id="n-carrinho">0</span></button></div>
  <div><p class="eyebrow" id="eyebrow">Loja</p><h1 id="titulo">Carregando…</h1><p class="lead" id="lead"></p></div>
</div></header>
<main id="main" aria-live="polite"><section class="card vazio">Carregando os produtos…</section></main>
<div class="barra" id="barra" hidden><div class="barra-in"><span id="barra-t"></span><button type="button" class="b pri" id="barra-ir">Finalizar pedido →</button></div></div>
<section class="card cadastro" id="cadastro" style="margin:18px auto;max-width:560px">
  <h2 style="margin:0 0 6px">Receba novidades e ofertas</h2>
  <p style="margin:0 0 12px;color:var(--muted)">Cadastre seu e-mail. Você escolhe se quer receber promoções.</p>
  <form id="cad-form" novalidate>
    <label class="campo">Nome <input type="text" id="cad-nome" maxlength="80" autocomplete="name"></label>
    <label class="campo">E-mail <input type="email" id="cad-email" required maxlength="120" autocomplete="email"></label>
    <label class="campo">WhatsApp (opcional) <input type="tel" id="cad-tel" maxlength="30" autocomplete="tel"></label>
    <label class="check"><input type="checkbox" id="cad-termos" required> Li e aceito os <a href="termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>, incluindo o tratamento dos meus dados conforme a LGPD.</label>
    <label class="check"><input type="checkbox" id="cad-mkt"> Quero receber e-mails com ofertas e promoções da GUXTA. Posso cancelar a qualquer momento pelo link no próprio e-mail.</label>
    <p id="cad-msg" role="status" style="min-height:20px;margin:10px 0"></p>
    <button class="b pri" type="submit" id="cad-enviar">Cadastrar</button>
  </form>
</section>
<p class="rodape" id="rodape"></p>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const N=v=>Number(v)||0;
  const brl=v=>N(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const qtdF=v=>N(v).toLocaleString("pt-BR",{maximumFractionDigits:2});
  const cfg=window.GLARA_CONFIG||{};
  const urlSupabase=u=>{u=String(u||"").trim();let m=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);if(m)return "https://"+m[1]+".supabase.co";m=u.match(/^(?:https?:\/\/)?([a-z0-9-]+\.supabase\.(?:co|in))/i);if(m)return "https://"+m[1].toLowerCase();return u.replace(/\/+$/,"")};
  const main=$("#main"), dlg=$("#dlg");
  let tT=null;const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3200)};
  const guarda={get(k,d){try{const v=localStorage.getItem("guxta_loja_"+k);return v?JSON.parse(v):d}catch(_){return d}},set(k,v){try{localStorage.setItem("guxta_loja_"+k,JSON.stringify(v))}catch(_){}},del(k){try{localStorage.removeItem("guxta_loja_"+k)}catch(_){}}};
  const fim=(t,h)=>{$("#titulo").textContent=t;main.innerHTML=`<section class="card vazio">${h||""}</section>`};
  if(!window.supabase||!cfg.supabaseUrl)return fim("Loja indisponível","Não foi possível carregar agora. Tente de novo em alguns minutos.");
  const sb=window.supabase.createClient(urlSupabase(cfg.supabaseUrl),String(cfg.supabaseAnonKey||"").trim(),{auth:{persistSession:false}});
  const {data:L,error}=await sb.rpc("loja_ver");
  if(error||!L)return fim("Loja indisponível","Não foi possível carregar os produtos agora. Tente de novo em alguns minutos.");
  const emp=L.empresa||cfg.marca||"GUXTA";
  document.title=(L.titulo||"Loja")+" · "+emp;
  $("#eyebrow").textContent="Loja · "+emp;$("#titulo").textContent=L.titulo||"Material gráfico";$("#lead").textContent=L.texto||"";
  $("#rodape").innerHTML=[`<b>${esc(emp)}</b>`,L.documento,L.telefone,L.email,L.site].filter(Boolean).map(x=>x.startsWith("<b>")?x:esc(x)).join(" · ");
  if(!L.ativa){fim("Loja fechada no momento",`Fale com a gente${L.telefone?": "+esc(L.telefone):""}.`);$("#btn-carrinho").hidden=true;return}

  const P=L.produtos||[], ent=L.entrega||{};
  const prod=id=>P.find(p=>p.id===id);
  const faixa=(p,q)=>(p.faixas||[]).find(f=>N(f.qtd)===N(q));
  const ehM2=p=>p&&p.preco_tipo==="m2";
  const r4=v=>Math.round(N(v)*1e4)/1e4, cm=v=>N(v).toLocaleString("pt-BR",{maximumFractionDigits:1}), m2F=v=>N(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const m2=(p,l,a,q)=>{const area=r4(N(l)*N(a)/10000), ac=Math.max(area,N(p.area_min)), tot=r4(ac*N(q));return {area,ac,tot,preco:Math.round(tot*N(p.preco_m2)*100)/100}};
  const precoIt=i=>{const p=prod(i.produto_id);return ehM2(p)?m2(p,i.largura,i.altura,i.qtd).preco:N((faixa(p,i.qtd)||{}).preco)};
  const itemOk=i=>{const p=prod(i.produto_id);return !!p&&(ehM2(p)?N(i.largura)>=1&&N(i.altura)>=1&&N(i.qtd)>=1:!!faixa(p,i.qtd))};
  const qtdTxt=(i,p)=>ehM2(p)?`${cm(i.largura)}×${cm(i.altura)} cm · ${qtdF(i.qtd)} un (${m2F(m2(p,i.largura,i.altura,i.qtd).tot)} m²)`:`${qtdF(i.qtd)} ${esc(p.unidade||"un")}`;
  const q0=new URLSearchParams(location.search);
  const origem=(q0.get("utm_source")||q0.get("origem")||q0.get("ref")||guarda.get("origem","")||"").slice(0,60);if(origem)guarda.set("origem",origem);

  // estado
  let car=(guarda.get("carrinho",[])||[]).filter(itemOk);
  let dados=guarda.get("dados",{nome:"",documento:"",email:"",telefone:"",empresa:"",aceita_ofertas:false,endereco:{cep:"",rua:"",numero:"",complemento:"",bairro:"",cidade:"",uf:"",referencia:""}});
  let token=guarda.get("token",null), identidade=guarda.get("identidade",""), entrega=guarda.get("entrega","");
  let cat="", busca="", modo="vitrine", passo=1, calc=null;
  const salvarLocal=()=>{guarda.set("carrinho",car);guarda.set("dados",dados);guarda.set("identidade",identidade);guarda.set("entrega",entrega);if(token)guarda.set("token",token)};
  const subtotal=()=>car.reduce((s,i)=>s+precoIt(i),0);

    else if(!r.error&&!r.data){token=null;guarda.del("token")}}
  function limparPedido(){car=[];token=null;identidade="";entrega="";["carrinho","token","identidade","entrega"].forEach(k=>guarda.del(k))}

  /* ---------- vitrine ---------- */
  const cats=[...new Set(P.map(p=>p.categoria).filter(Boolean))];
  const aPartir=p=>ehM2(p)?N(p.preco_m2):Math.min(...(p.faixas||[]).map(f=>N(f.preco)));
  const fotoHTML=p=>p.foto?`<img src="${esc(p.foto)}" alt="" loading="lazy">`:`<span class="ini" aria-hidden="true">${esc((p.nome||"?").trim().slice(0,1).toUpperCase())}</span>`;
  function ctaHTML(){const c=L.cta;if(!c)return "";const f=String(L.telefone||"").replace(/\D/g,""), fone=f?(f.length<=11?"55"+f:f):"";
    const msg=encodeURIComponent(`Olá! Vi a loja e quero saber mais sobre os planos de ${String(c.titulo||"assessoria").toLowerCase()}.`);
    return `<section class="cta"><div><p class="eyebrow" style="color:#FF6B73">Para a sua marca crescer</p><h2>${esc(c.titulo)}</h2><p>${esc(c.texto)}</p></div>
      <div class="cta-b">${L.tem_planos?`<a class="b pri" href="https://cliente.guxta.com.br/planos.html">Ver os planos →</a>`:""}${fone?`<a class="b" href="https://wa.me/${fone}?text=${msg}" target="_blank" rel="noopener">Falar no WhatsApp</a>`:""}</div></section>`}
  function vitrine(){
    const q=busca.trim().toLowerCase(), vis=P.filter(p=>(!cat||p.categoria===cat)&&(!q||(p.nome+" "+p.descricao+" "+p.categoria).toLowerCase().includes(q)));

    main.innerHTML=`${pend&&pend.token?`<section class="card aviso" style="border-radius:16px"><b>Você tem um pedido aguardando pagamento.</b> <a href="https://cliente.guxta.com.br/pagar.html?t=${esc(pend.token)}"><b>Pagar agora · ${brl(pend.valor)}</b></a></section>`:""}

      <section class="grade" id="grade">${vis.map(p=>`<button type="button" class="prod" data-p="${p.id}"><span class="foto">${fotoHTML(p)}</span>
        <span class="prod-c">${p.categoria?`<small class="cat">${esc(p.categoria)}</small>`:""}<b>${esc(p.nome)}</b><p>${esc(p.descricao)}</p>
          <span class="apartir">${ehM2(p)?"por m²":"a partir de"}<strong>${brl(aPartir(p))}${ehM2(p)?"<small> /m²</small>":""}</strong></span></span></button>`).join("")||`<div class="card vazio" style="grid-column:1/-1">${P.length?"Nenhum produto encontrado.":"Nenhum produto disponível ainda."}</div>`}</section>${ctaHTML()}`;
    barra();
  }
  function barra(){const n=car.length;$("#n-carrinho").textContent=n;$("#barra").hidden=!(n&&modo==="vitrine");
    $("#barra-t").innerHTML=`${n} ${n===1?"item":"itens"}<b>${brl(subtotal())}</b>`}

  function abrirProduto(id){const p=prod(id);if(!p)return;if(ehM2(p))return abrirM2(p);let sel=N((p.faixas[0]||{}).qtd);
    const desenha=()=>{dlg.innerHTML=`<form method="dialog" class="dlg" id="f-prod">
      <div class="dlg-h"><h2>${esc(p.nome)}</h2><button type="button" class="x" data-fechar aria-label="Fechar">✕</button></div>

        <p class="h3" style="margin-top:14px">Escolha a quantidade</p>
        <div class="faixas" role="radiogroup" aria-label="Quantidade">${p.faixas.map(f=>`<label class="faixa${N(f.qtd)===sel?" on":""}"><input type="radio" name="fx" value="${f.qtd}" ${N(f.qtd)===sel?"checked":""}>
          <b>${qtdF(f.qtd)} ${esc(p.unidade||"un")}</b><span class="v">${brl(f.preco)}${N(f.qtd)>1?`<small>${brl(N(f.preco)/N(f.qtd))} cada</small>`:""}</span></label>`).join("")}</div></div>
      <div class="dlg-f"><b style="font-size:20px">${brl((faixa(p,sel)||{}).preco)}</b><button type="submit" class="b pri">Adicionar ao carrinho</button></div></form>`};
    desenha();abrir();
    dlg.onchange=e=>{if(e.target.name==="fx"){sel=N(e.target.value);desenha()}};
    dlg.onsubmit=e=>{e.preventDefault();car.push({produto_id:p.id,qtd:sel,arte:"",arquivo:null});salvarLocal();fechar();barra();toast(p.nome+" no carrinho.");abrirCarrinho()};
  }
  function abrirM2(p){const md={l:"",a:"",q:1};
    const conta=()=>{const ok=N(md.l)>=1&&N(md.a)>=1&&N(md.q)>=1, c=ok?m2(p,md.l,md.a,md.q):null;
      const r=dlg.querySelector("#m2-res"), t=dlg.querySelector("#m2-tot"), b=dlg.querySelector("#m2-add");

      t.textContent=ok?brl(c.preco):"–";b.disabled=!ok};
    dlg.innerHTML=`<form method="dialog" class="dlg" id="f-m2">
      <div class="dlg-h"><h2>${esc(p.nome)}</h2><button type="button" class="x" data-fechar aria-label="Fechar">✕</button></div>
      <div class="dlg-b">${p.foto?`<div class="foto" style="border-radius:14px;margin-bottom:12px">${fotoHTML(p)}</div>`:""}
        ${p.descricao?`<p style="margin:0 0 8px">${esc(p.descricao)}</p>`:""}
        <div class="info"><span>📐 ${brl(p.preco_m2)} por m²${N(p.area_min)?` · mínimo de ${m2F(p.area_min)} m² por peça`:""}</span>${p.prazo?`<span>⏱ Produção: ${esc(p.prazo)}</span>`:""}<span>🎨 Criação de arte: ${N(p.arte_valor)?"+ "+brl(p.arte_valor)+" se precisar":"sem custo extra"}</span></div>

          <span class="m2-x" aria-hidden="true">×</span><div><label for="m2-a">Altura (cm)</label><input type="text" id="m2-a" inputmode="decimal" placeholder="Ex.: 120"></div>
          <div><label for="m2-q">Quantidade</label><input type="text" id="m2-q" inputmode="numeric" value="1"></div></div>
        <p class="sub" id="m2-res" style="margin:10px 0 0" aria-live="polite"></p></div>
      <div class="dlg-f"><b style="font-size:20px" id="m2-tot">–</b><button type="submit" class="b pri" id="m2-add" disabled>Adicionar ao carrinho</button></div></form>`;
    abrir();conta();setTimeout(()=>{const i=dlg.querySelector("#m2-l");i&&i.focus()},50);
    const num_=v=>{v=String(v||"").replace(",",".").replace(/[^\d.]/g,"");return v};
    dlg.onchange=null;
    dlg.oninput=e=>{const t=e.target;if(t.id==="m2-l")md.l=num_(t.value);if(t.id==="m2-a")md.a=num_(t.value);if(t.id==="m2-q")md.q=String(t.value).replace(/\D/g,"");conta()};
    dlg.onsubmit=e=>{e.preventDefault();if(dlg.querySelector("#m2-add").disabled)return;
      car.push({produto_id:p.id,largura:N(md.l),altura:N(md.a),qtd:Math.max(1,parseInt(md.q)||1),arte:"",arquivo:null});salvarLocal();fechar();barra();toast(p.nome+" no carrinho.");abrirCarrinho()}}
  function abrirCarrinho(){dlg.oninput=null;

  function abrir(){if(!dlg.open){if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","")}}
  function fechar(){if(dlg.open&&typeof dlg.close==="function")dlg.close();dlg.removeAttribute("open")}

  /* ---------- finalizar pedido ---------- */
  const ETAPAS_=[[1,"Carrinho"],[2,"Seus dados"],[3,"Arte"],[4,"Entrega"],[5,"Pagamento"]];
  const etapas=()=>ETAPAS_.filter(([n])=>fisico()||(n!==3&&n!==4));
  const passosHTML=()=>{const E=etapas();return `<ol class="passos" style="grid-template-columns:repeat(${E.length},1fr)" aria-label="Etapas">${E.map(([n,t])=>`<li class="${n<passo?"feito":n===passo?"atual":""}"${n===passo?' aria-current="step"':""}>${t}</li>`).join("")}</ol>`};
  const docFmt=d=>{d=String(d||"").replace(/\D/g,"");if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4");if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,"$1.$2.$3/$4-$5");return d};
  function cpfOk(c){c=c.replace(/\D/g,"");if(c.length!==11||/^(\d)\1+$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);let d=(s*10)%11%10;if(d!==+c[9])return false;s=0;for(let i=0;i<10;i++)s+=+c[i]*(11-i);d=(s*10)%11%10;return d===+c[10]}
  function cnpjOk(c){c=c.replace(/\D/g,"");if(c.length!==14||/^(\d)\1+$/.test(c))return false;const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)===+c[12]&&calc(13)===+c[13]}
  const docOk=d=>{d=String(d||"").replace(/\D/g,"");return d.length===11?cpfOk(d):d.length===14?cnpjOk(d):false};
  const cepFmt=c=>{c=String(c||"").replace(/\D/g,"").slice(0,8);return c.length>5?c.slice(0,5)+"-"+c.slice(5):c};
  const endTxt=a=>[[a.rua,a.numero].filter(Boolean).join(", "),a.complemento,a.bairro,[a.cidade,a.uf].filter(Boolean).join("/"),a.cep?"CEP "+cepFmt(a.cep):""].filter(Boolean).join(" · ");
  const resumoLinhas=()=>`<div class="linhas"><div><span>Produtos</span><b>${brl(subtotal())}</b></div>
      ${artesTot()?`<div><span>Criação de arte</span><b>${brl(artesTot())}</b></div>`:""}${idTot()?`<div><span>Identidade visual</span><b>${brl(idTot())}</b></div>`:""}
      ${entrega&&fisico()?`<div><span>${entrega==="entrega"?"Entrega":"Retirada"}</span><b>${frete()?brl(frete()):"Sem custo"}</b></div>`:""}</div>
    <div class="tot"><span>Total</span><b>${brl(total())}</b></div>`;

  function checkout(){

      <div class="linhas"><div><span>Subtotal</span><b>${brl(subtotal())}</b></div></div>
      <div class="acoes"><button class="b pri" data-ir="2">Continuar →</button><button class="link" data-vitrine>Adicionar mais produtos</button></div>`;

        <div class="largo"><label class="check"><input type="checkbox" id="d-ofertas" ${dados.aceita_ofertas?"checked":""}><span>Quero receber ofertas e novidades de ${esc(emp)} por e-mail e WhatsApp. Posso sair quando quiser.</span></label></div>

      <ul class="itens">${car.map(i=>{const p=prod(i.produto_id),f={preco:precoIt(i)};return `<li><span><b>${esc(p.nome)}</b><br><small>${qtdTxt(i,p)} · ${p.tipo==="servico"?"serviço":i.arte==="tem"?"arte enviada ("+esc((i.arquivo||{}).nome||"")+"), será revisada":"criação da arte"+(N(p.arte_valor)?" + "+brl(p.arte_valor):"")}</small></span><span class="v">${brl(f.preco)}</span></li>`}).join("")}</ul>

    main.innerHTML=`<section class="card">${passosHTML()}</section><section class="card">${corpo}</section>`;
  }
  function arteHTML(){return car.map((i,k)=>{const p=prod(i.produto_id);if(p.tipo==="servico")return "";return `<div class="arte-it"><h3>${esc(p.nome)} · ${qtdTxt(i,p)}</h3>

      ${i.arte==="tem"?`<div class="envio">${i.arquivo?`<span class="ok">✓ Arquivo enviado: ${esc(i.arquivo.nome)}</span><small>Nossa equipe vai revisar a arte e avisa se precisar de algum ajuste antes de imprimir.</small>
          <label class="link" style="padding:0;text-align:left;cursor:pointer">Trocar o arquivo<input type="file" data-up="${k}" hidden accept=".pdf,.jpg,.jpeg,.png,.ai,.cdr,.psd,.eps,.svg,.zip,.rar,.tif,.tiff"></label>`
        :`<label for="up-${k}">Envie a arte (PDF, JPG, PNG, AI, CDR, PSD ou ZIP, até 50 MB)</label><input type="file" id="up-${k}" data-up="${k}" accept=".pdf,.jpg,.jpeg,.png,.ai,.cdr,.psd,.eps,.svg,.zip,.rar,.tif,.tiff"><small id="up-st-${k}">Ela será revisada pela nossa equipe antes da impressão.</small>`}</div>`:""}
    </div>`}).join("")}
  function identidadeHTML(){return `<div class="arte-it" style="margin-top:10px"><h3>Você já tem identidade visual?</h3><p class="sub" style="margin:0">Logo, cores e tipografia da marca, para criarmos a arte.</p>
      <div class="opcoes" role="radiogroup" aria-label="Identidade visual">
        <label class="opc${identidade==="tem"?" on":""}"><input type="radio" name="ident" value="tem" ${identidade==="tem"?"checked":""}><span class="opc-t"><b>Sim, já tenho</b></span><small>A gente pede o logo pelo WhatsApp depois do pagamento.</small></label>
        <label class="opc${identidade==="criar"?" on":""}"><input type="radio" name="ident" value="criar" ${identidade==="criar"?"checked":""}><span class="opc-t"><b>Não, quero criar</b><span class="opc-v">${N(L.identidade_valor)?"+ "+brl(L.identidade_valor):"Sem custo"}</span></span><small>${esc(L.identidade_info||"")}</small></label>
      </div></div>`}

  function lerDados(){const v=id=>(($("#"+id)||{}).value||"").trim();if(!$("#d-nome"))return;
    dados={nome:v("d-nome"),documento:v("d-doc").replace(/\D/g,""),empresa:v("d-emp"),email:v("d-email"),telefone:v("d-tel"),aceita_ofertas:$("#d-ofertas").checked,
      endereco:{cep:v("d-cep").replace(/\D/g,""),rua:v("d-rua"),numero:v("d-num"),complemento:v("d-comp"),bairro:v("d-bai"),cidade:v("d-cid"),uf:v("d-uf").toUpperCase(),referencia:""}};
    dados.end=dados.endereco;salvarLocal()}
  function validarDados(){const er=$("#erro");const f=(t,id)=>{er.textContent=t;$("#"+id).focus();return false};
    if(dados.nome.split(/\s+/).filter(Boolean).length<2)return f("Escreva o nome completo.","d-nome");
    if(!docOk(dados.documento))return f("Confira o CPF ou o CNPJ: o número não está válido.","d-doc");
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(dados.email))return f("Confira o e-mail.","d-email");
    if(dados.telefone.replace(/\D/g,"").length<10)return f("Informe o WhatsApp com DDD.","d-tel");
    return true}
  const endOk=()=>{const d=dados.endereco||{};return String(d.cep||"").length===8&&d.rua&&d.numero&&d.cidade};
  async function salvarServidor(){
    const itens=car.map(i=>({produto_id:i.produto_id,qtd:i.qtd,largura:i.largura,altura:i.altura,arte:i.arte||"",arquivo:i.arquivo||null}));
    const r=await sb.rpc("loja_salvar",{p_token:token,p_dados:{...dados,origem},p_itens:itens,p_identidade:identidade,p_entrega:entrega});
    if(r.error)return r.error;token=r.data.token;calc=r.data;salvarLocal();return null}
  const msgErro=m=>/produto_indisponivel|quantidade_indisponivel/.test(m)?"Um produto do carrinho mudou ou saiu da loja. Remova e adicione de novo.":/pedido_fechado/.test(m)?"Este pedido já foi fechado. Recarregue a página.":/documento/.test(m)?"Confira o CPF ou o CNPJ.":/telefone/.test(m)?"Informe o WhatsApp com DDD.":/email/.test(m)?"Confira o e-mail.":/endereco_entrega/.test(m)?"Para entrega, preencha CEP, rua, número e cidade em Seus dados.":/medida_invalida/.test(m)?"Confira a medida de um produto do carrinho.":/arquivo_pendente/.test(m)?"Envie o arquivo da arte que você já tem.":"Não deu para continuar agora. Verifique a internet e tente de novo.";

  async function enviarArte(k,file){
    const st=$("#up-st-"+k);const i=car[k];
    if(file.size>50*1024*1024){toast("O arquivo passa de 50 MB. Mande um menor ou um link pelo WhatsApp depois.");return}
    if(!token){const e=await salvarServidor();if(e){toast(msgErro(e.message||""));return}}
    st&&(st.textContent="Enviando… não feche a página.");
    const nome=file.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w.\-]+/g,"_").slice(-80);
    const caminho=`${token}/${k}-${Date.now()}-${nome}`;
    const {error}=await sb.storage.from("loja-artes").upload(caminho,file,{upsert:false,contentType:file.type||"application/octet-stream"});
    if(error){st&&(st.textContent="Não deu para enviar. Tente de novo.");toast("Não deu para enviar o arquivo. Tente de novo.");return}
    i.arquivo={caminho,nome:file.name.slice(0,160)};salvarLocal();await salvarServidor();checkout();toast("Arte recebida! Vamos revisar antes de imprimir.")}

  async function ir(p){const er=$("#erro");
    if(!fisico()&&(p===3||p===4))p=p>passo?5:2;
    if(passo===2&&p>2){lerDados();if(!validarDados())return;
      const b=main.querySelector('[data-ir="3"]');b&&(b.disabled=true);const e=await salvarServidor();b&&(b.disabled=false);if(e){er.textContent=msgErro(e.message||"");return}}
    if(passo===2&&p<2)lerDados();
    if(passo===3&&p>3){const k=car.findIndex(i=>!ehServ(i)&&!i.arte);if(k>=0){er.textContent="Escolha uma opção de arte para cada produto.";return}
      const s=car.findIndex(i=>!ehServ(i)&&i.arte==="tem"&&!i.arquivo);if(s>=0){er.textContent="Envie o arquivo da arte (ou escolha que a gente crie).";return}
      if(precisaId()&&!identidade){er.textContent="Diga se você já tem identidade visual.";return}
      await salvarServidor()}
    if(passo===4&&p>4){if(!entrega){er.textContent="Escolha retirada ou entrega.";return}
      if(entrega==="entrega"&&!endOk()){er.textContent="Para entrega, preencha o endereço completo em Seus dados (CEP, rua, número e cidade).";return}
      const e=await salvarServidor();if(e){er.textContent=msgErro(e.message||"");return}}
    passo=p;checkout();window.scrollTo({top:0,behavior:"smooth"})}
  async function pagar(){const b=$("#pagar"), er=$("#erro");b.disabled=true;b.textContent="Gerando o pedido…";
    let e=await salvarServidor();
    if(!e){const r=await sb.rpc("loja_fechar",{p_token:token});
      if(!r.error&&r.data&&r.data.pagamento&&r.data.pagamento.token){const pg=r.data.pagamento;guarda.set("pendente",pg);limparPedido();location.href="https://cliente.guxta.com.br/pagar.html?t="+encodeURIComponent(pg.token);return}
      e=r.error||{message:""}}
    b.disabled=false;b.textContent="Ir para o pagamento · "+brl(total())+" →";er.textContent=msgErro(e.message||"")}

  let cepUlt="";
  async function buscarCep(c){if(c===cepUlt)return;cepUlt=c;const dica=$("#cep-dica");dica&&(dica.textContent="Buscando o endereço…");
    try{const r=await fetch("https://viacep.com.br/ws/"+c+"/json/");const j=await r.json();if(c!==cepUlt)return;
      if(j.erro){dica&&(dica.textContent="CEP não encontrado. Preencha o endereço.");return}
      const p=(id,v)=>{const i=$("#"+id);if(i&&v&&!i.value)i.value=v};p("d-rua",j.logradouro);p("d-bai",j.bairro);p("d-cid",j.localidade);p("d-uf",j.uf);
      dica&&(dica.textContent="");const n=$("#d-num");n&&!n.value&&n.focus()}catch(_){dica&&(dica.textContent="")}}

  /* ---------- eventos ---------- */
  document.addEventListener("click",async e=>{
    const t=e.target;
    if(t.closest("[data-fechar]")){fechar();return}
    const pr=t.closest("[data-p]");if(pr){abrirProduto(pr.dataset.p);return}
    const c=t.closest("[data-cat]");if(c){cat=c.dataset.cat;vitrine();return}
    const tr=t.closest("[data-tirar]");if(tr){car.splice(+tr.dataset.tirar,1);salvarLocal();barra();
      if(modo==="checkout"){if(!car.length){modo="vitrine";passo=1;vitrine()}else checkout()}else abrirCarrinho();return}
    if(t.closest("#btn-carrinho")){abrirCarrinho();return}
    if(t.closest("[data-checkout]")||t.closest("#barra-ir")){fechar();if(!car.length)return;modo="checkout";passo=passo>1&&token?passo:1;checkout();window.scrollTo({top:0});return}
    if(t.closest("[data-vitrine]")){modo="vitrine";vitrine();return}
    const i=t.closest("[data-ir]");if(i){e.preventDefault();ir(+i.dataset.ir);return}
    if(t.closest("#pagar")){pagar();return}
  });
  main.addEventListener("change",e=>{const t=e.target;
    if(t.dataset.arte!=null){const k=+t.dataset.arte;car[k].arte=t.value;if(t.value==="criar")car[k].arquivo=null;salvarLocal();checkout();return}
    if(t.name==="ident"){identidade=t.value;salvarLocal();checkout();return}
    if(t.name==="ent"){entrega=t.value;salvarLocal();checkout();return}
    if(t.dataset.up!=null&&t.files&&t.files[0]){enviarArte(+t.dataset.up,t.files[0]);return}});
  main.addEventListener("input",e=>{const t=e.target;
    if(t.id==="busca"){busca=t.value;const g=$("#grade"),tmp=document.createElement("div");const foco=t.selectionStart;vitrine();const nb=$("#busca");nb.focus();try{nb.setSelectionRange(foco,foco)}catch(_){}return}
    if(t.id==="d-doc"){const d=t.value.replace(/\D/g,"").slice(0,14);if(d.length===11||d.length===14)t.value=docFmt(d)}
    if(t.id==="d-cep"){const c=t.value.replace(/\D/g,"").slice(0,8);t.value=cepFmt(c);if(c.length===8)buscarCep(c)}});
  main.addEventListener("submit",e=>{e.preventDefault();const b=main.querySelector('.acoes [data-ir].pri');b&&b.click()});
  dlg.addEventListener("click",e=>{if(e.target===dlg)fechar()});

  vitrine();
  const pq=q0.get("p");if(pq&&prod(pq))abrirProduto(pq);
})();
</script>
<script>
(function(){
  const cfgL=window.GLARA_CONFIG||{};
  const VERSAO_TERMOS="2026-11-v1";
  const form=document.getElementById("cad-form"); if(!form||!window.supabase)return;
  const sbL=window.supabase.createClient(String(cfgL.supabaseUrl||"").trim(),String(cfgL.supabaseAnonKey||"").trim(),{auth:{persistSession:false}});
  const msg=(t,ok)=>{const m=document.getElementById("cad-msg");m.textContent=t;m.style.color=ok?"#137A2F":"#B8000E"};
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    const email=document.getElementById("cad-email").value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg("Confira o seu e-mail.",false);return}
    if(!document.getElementById("cad-termos").checked){msg("Para se cadastrar, aceite os termos e a política de privacidade.",false);return}
    const btn=document.getElementById("cad-enviar"); btn.disabled=true; msg("Salvando…",true);
    const {error}=await sbL.rpc("loja_cadastrar_contato",{
      p_nome:document.getElementById("cad-nome").value.trim(),
      p_email:email,
      p_telefone:document.getElementById("cad-tel").value.trim(),
      p_marketing:document.getElementById("cad-mkt").checked,
      p_versao:VERSAO_TERMOS,
      p_origem:(new URLSearchParams(location.search).get("origem")||"loja").slice(0,60)
    });
    btn.disabled=false;
    if(error){msg("Não deu para cadastrar agora. Tente de novo.",false);return}
    form.reset(); msg("Pronto! Seu cadastro foi feito.",true);
  });
})();
</script>
