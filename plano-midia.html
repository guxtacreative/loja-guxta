<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Plano de mídia</title>
<link rel="icon" type="image/png" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{--red:#FF6B2C;--ink:#111111;--muted:#6B6B6B;--line:#E6E6E6;--soft:#F6F6F6;--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:#E9E9E9;color:var(--ink);font:400 14px/1.45 var(--font);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0A0A0A;color:#fff}
  .bar p{margin:0;font-size:13px;color:#BDBDBD;flex:1 1 220px}
  .bts{display:flex;gap:8px;flex-wrap:wrap}
  .b{appearance:none;border:1px solid #3A3A3A;background:#1A1A1A;color:#fff;font:700 14px var(--font);padding:10px 16px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .b.pri{background:var(--red);border-color:var(--red)}
  .b[disabled]{opacity:.6;cursor:wait}
  .palco{padding:24px 16px 60px;display:flex;justify-content:center}
  .escala{width:297mm;max-width:100%}
  .folha{width:297mm;min-height:209mm;background:#fff;padding:13mm 14mm 11mm;box-shadow:0 20px 50px -25px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:16px;transform-origin:top left}
  .msg{background:#fff;border-radius:12px;padding:28px;max-width:520px;text-align:center;margin:0 auto}
  .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:14px;border-bottom:4px solid var(--red)}
  .cab img{height:40px;width:auto;display:block}
  .nome-emp{font:900 24px var(--font)}
  .doc{text-align:right}
  .doc .eyebrow{font:800 11px var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
  .doc h1{margin:2px 0 4px;font:900 26px/1.1 var(--font);letter-spacing:-.02em}
  .doc small{display:block;color:var(--muted);font-size:12px}
  .topo{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
  .box{background:var(--soft);border-radius:10px;padding:11px 13px}
  .box .rot{font:800 10px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .box b{font-size:15px}
  .box p{margin:0;font-size:13px;white-space:pre-line}
  .box.inv{background:#0A0A0A;color:#fff}
  .box.inv .rot{color:#FF6B2C}
  .box.inv b{font:900 24px var(--font)}
  .box.inv small{display:block;color:#BDBDBD;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{background:#0A0A0A;color:#fff;font:700 10px var(--font);letter-spacing:.1em;text-transform:uppercase;padding:8px 9px;text-align:left}
  thead th:first-child{border-radius:8px 0 0 8px}thead th:last-child{border-radius:0 8px 8px 0}
  td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
  tr{break-inside:avoid;page-break-inside:avoid}
  td.c{font-weight:700;border-left:4px solid var(--cor)}
  td small{display:block;color:var(--muted);font-weight:400}
  .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .baixo{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
  .dist h3,.obs h3{margin:0 0 8px;font:800 10.5px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
  .dist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .dist li{display:grid;grid-template-columns:150px 1fr 90px 36px;gap:8px;align-items:center;font-size:12.5px}
  .dist .tr{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
  .dist .tr i{display:block;height:100%;border-radius:999px}
  .obs p{margin:0;font-size:13px;white-space:pre-line}
  .tots{display:flex;flex-direction:column;gap:5px;margin-top:12px}
  .tots div{display:flex;justify-content:space-between;font-size:13px}
  .tots .t{background:var(--red);color:#fff;border-radius:10px;padding:10px 12px;align-items:baseline}
  .tots .t b{font:900 20px var(--font)}
  .rodape{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
  @page{size:A4 landscape;margin:0}
  @media print{html,body{background:#fff}.bar{display:none!important}.palco{padding:0}.folha{box-shadow:none;transform:none!important;min-height:200mm}.escala{height:auto!important}}
  @media (max-width:820px){.palco{padding:12px 8px 40px;justify-content:flex-start}}
</style>
<link rel="stylesheet" href="japy-tema.css">
</head>
<body>
<div class="bar" id="bar" hidden>
  <p id="bar-txt">Plano de mídia com a sua marca.</p>
  <div class="bts"><a class="b" href="admin.html" id="voltar" hidden>‹ Painel</a><button class="b" id="imprimir" type="button">Imprimir</button><button class="b pri" id="baixar" type="button">Baixar PDF</button></div>
</div>
<div class="palco"><div class="escala" id="escala"><div id="root" class="msg">Carregando o plano…</div></div></div>
<script src="config.js"></script>
<script src="planomidia.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
(async function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const N=v=>Number(v)||0;
  const brl=v=>N(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const dmy=iso=>{if(!iso)return"";const [y,m,d]=String(iso).slice(0,10).split("-");return d+"/"+m+"/"+y};
  const slug=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  const cfg=window.GLARA_CONFIG||{};
  const cor=c=>window.GlaraPlanoMidia?window.GlaraPlanoMidia.corCanal(c):"#FF6B2C";
  const urlSupabase=u=>{u=String(u||"").trim();let m=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);if(m)return "https://"+m[1]+".supabase.co";m=u.match(/^(?:https?:\/\/)?([a-z0-9-]+\.supabase\.(?:co|in))/i);if(m)return "https://"+m[1].toLowerCase();return u.replace(/\/+$/,"")};
  const erro=t=>{$("#root").className="msg";$("#root").innerHTML=t};
  const qs=new URLSearchParams(location.search), id=qs.get("id"), tk=qs.get("t");
  if(!window.supabase||!cfg.supabaseUrl)return erro("Não foi possível carregar agora.");
  const sb=window.supabase.createClient(urlSupabase(cfg.supabaseUrl),String(cfg.supabaseAnonKey||"").trim());
  let p,e={},cli="";
  if(tk){const r=await sb.rpc("plano_midia_ver",{p_token:tk});if(r.error||!r.data)return erro("Este plano não está disponível. Fale com quem enviou o link.");p=r.data;e=p.empresa||{};cli=p.cliente_nome}
  else if(id){const {data:{session}}=await sb.auth.getSession();if(!session)return erro(`Entre no painel primeiro.<br><br><a class="b pri" href="admin.html">Ir para o painel</a>`);
    const [a,b]=await Promise.all([sb.from("planos_midia").select("*").eq("id",id).maybeSingle(),sb.from("empresa").select("*").eq("id",1).maybeSingle()]);
    if(a.error||!a.data)return erro("Não encontrei este plano.");p=a.data;e=b.data||{};cli=p.cliente_nome;
    if(!cli&&p.cliente_id){const c=await sb.from("clientes").select("nome").eq("id",p.cliente_id).maybeSingle();if(c.data)cli=c.data.nome}
    $("#voltar").hidden=false}
  else return erro("Link incompleto.");
  const emp=e.nome||cfg.marca||"GUXTA", linhas=p.linhas||[], tot=linhas.reduce((s,l)=>s+N(l.verba),0), taxa=N(p.taxa_gestao);
  const por={};linhas.forEach(l=>{por[l.canal]=(por[l.canal]||0)+N(l.verba)});const dist=Object.entries(por).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  document.title=`Plano-de-midia-${slug(cli)||"cliente"}`;
  $("#root").className="folha";
  $("#root").innerHTML=`
    <header class="cab"><div><img src="logo.png" alt="${esc(emp)}" onerror="this.outerHTML='<span class=nome-emp>${esc(emp)}</span>'"></div>
      <div class="doc"><div class="eyebrow">Plano de mídia</div><h1>${esc(p.titulo||"Plano de mídia")}</h1><small>${esc(cli||"")}${p.inicio?" · "+dmy(p.inicio)+(p.fim?" a "+dmy(p.fim):""):""}</small></div></header>
    <section class="topo">
      <div class="box"><div class="rot">Objetivo</div><p>${esc(p.objetivo||"—")}</p></div>
      <div class="box"><div class="rot">Público principal</div><p>${esc(p.publico||"—")}</p></div>
      <div class="box inv"><div class="rot">Investimento total</div><b>${brl(tot+taxa)}</b><small>mídia ${brl(tot)}${taxa?" + gestão "+brl(taxa):""}</small></div>
    </section>
    <table><thead><tr><th>Canal</th><th>Formato</th><th>Objetivo</th><th>Público</th><th>Período</th><th>Meta</th><th class="num">Verba</th></tr></thead>
      <tbody>${linhas.map(l=>`<tr><td class="c" style="--cor:${cor(l.canal)}">${esc(l.canal)}</td><td>${esc(l.formato||"—")}</td><td>${esc(l.objetivo||"—")}</td><td>${esc(l.publico||"—")}</td>
        <td>${l.inicio?dmy(l.inicio).slice(0,5)+(l.fim?" a "+dmy(l.fim).slice(0,5):""):"—"}</td><td>${esc(l.meta||"—")}</td><td class="num"><b>${brl(l.verba)}</b></td></tr>`).join("")}</tbody></table>
    <section class="baixo">
      <div class="dist"><h3>Distribuição da verba</h3><ul>${dist.map(([c,v])=>`<li><span>${esc(c)}</span><span class="tr"><i style="width:${tot?v/tot*100:0}%;background:${cor(c)}"></i></span><b class="num">${brl(v)}</b><small class="num">${tot?Math.round(v/tot*100):0}%</small></li>`).join("")}</ul></div>
      <div class="obs">${p.observacoes?`<h3>Observações</h3><p>${esc(p.observacoes)}</p>`:""}
        <div class="tots"><div><span>Verba de mídia</span><b>${brl(tot)}</b></div>${taxa?`<div><span>Gestão</span><b>${brl(taxa)}</b></div>`:""}<div class="t"><span>Total</span><b>${brl(tot+taxa)}</b></div></div></div>
    </section>
    <footer class="rodape"><b>${esc(emp)}</b>${[e.telefone,e.email,e.site].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</footer>`;
  $("#bar").hidden=false;
  function ajustar(){const f=$("#root"),w=$("#escala").clientWidth,base=f.offsetWidth,s=Math.min(1,w/base);f.style.transform=s<1?`scale(${s})`:"";$("#escala").style.height=s<1?(f.offsetHeight*s)+"px":""}
  ajustar();addEventListener("resize",ajustar);if(document.fonts)document.fonts.ready.then(ajustar);
  $("#imprimir").addEventListener("click",()=>window.print());
  $("#baixar").addEventListener("click",async()=>{const bt=$("#baixar");if(!window.html2pdf){window.print();return}
    bt.disabled=true;bt.textContent="Gerando…";const f=$("#root"),tr=f.style.transform;f.style.transform="";
    try{await html2pdf().set({margin:0,filename:document.title+".pdf",image:{type:"jpeg",quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:"#FFFFFF",windowWidth:1200},
      jsPDF:{unit:"mm",format:"a4",orientation:"landscape"},pagebreak:{mode:["css","legacy"],avoid:["tr",".baixo",".topo"]}}).from(f).save()}catch(err){console.error(err);window.print()}
    f.style.transform=tr;bt.disabled=false;bt.textContent="Baixar PDF";ajustar()});
})();
</script>
<script src="ajuste-cores.js"></script>
</body>
</html>
