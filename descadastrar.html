<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sair da lista · GUXTA</title>
<style>body{font:16px system-ui,Arial,sans-serif;background:#F7F6F3;color:#111;margin:0;display:grid;place-items:center;min-height:100vh}.c{background:#fff;border:1px solid #E6E6E6;border-radius:16px;padding:28px;max-width:460px;text-align:center}</style>
</head>
<body>
<div class="c"><h1 style="font-size:22px;margin:0 0 10px">Sair da lista de ofertas</h1><p id="txt">Processando…</p></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const cfg=window.GLARA_CONFIG||{}, t=new URLSearchParams(location.search).get("t"), out=document.getElementById("txt");
  if(!t){out.textContent="Link inválido.";return}
  const sb=window.supabase.createClient(String(cfg.supabaseUrl||"").trim(),String(cfg.supabaseAnonKey||"").trim(),{auth:{persistSession:false}});
  const {data,error}=await sb.rpc("contato_descadastrar",{p_token:t});
  out.textContent=error?"Não deu para processar agora. Tente de novo mais tarde.":data?"Pronto. Você não receberá mais e-mails de ofertas. Os avisos sobre pedidos e orçamentos continuam.":"Este endereço já não está na lista de ofertas.";
})();
</script>
</body>
</html>
