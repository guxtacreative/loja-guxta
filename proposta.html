<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Proposta</title>
<link rel="icon" type="image/png" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap">
<style>
  :root{--red:#FF6B2C;--red-d:#FF6B2C;--ink:#111111;--muted:#6B6B6B;--line:#E6E6E6;--soft:#F5F5F5;--ok:#19A33B;--bg:#F2F2F2;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--assina:"Caveat","Segoe Script","Brush Script MT",cursive}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);-webkit-text-size-adjust:100%}
  a{color:inherit}
  .topo{background:linear-gradient(135deg,#0A0A0A 0%,#1A0003 55%,#E85A1E 100%);color:#fff;padding:22px 16px 74px}
  .topo-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .topo img{height:42px;width:auto;display:block}
  .topo .nome-emp{font:900 24px var(--font)}
  .topo .eyebrow{font:800 11px var(--font);letter-spacing:.16em;text-transform:uppercase;color:#FF6B2C;margin:0}
  .topo h1{margin:4px 0 0;font:900 clamp(26px,5vw,38px)/1.08 var(--font);letter-spacing:-.02em}
  .topo p{margin:6px 0 0;color:#D6D6D6}
  main{max-width:760px;margin:-54px auto 0;padding:0 16px 60px;display:flex;flex-direction:column;gap:14px}
  .card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 18px 40px -28px rgba(0,0,0,.35);border:1px solid var(--line)}
  .passos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:0;padding:0;counter-reset:p}
  .passos li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:600 12px var(--font);color:var(--muted);position:relative}
  .passos li::before{counter-increment:p;content:counter(p);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:#fff;color:var(--muted);font:800 13px var(--font);position:relative;z-index:1}
  .passos li::after{content:"";position:absolute;top:16px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--line)}
  .passos li:last-child::after{display:none}
  .passos li.feito{color:var(--ink)}
  .passos li.feito::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
  .passos li.feito::after{background:var(--ok)}
  .passos li.atual{color:var(--ink)}
  .passos li.atual::before{border-color:var(--red);color:var(--red);box-shadow:0 0 0 4px rgba(255,107,44,.15)}
  h2{margin:0 0 4px;font:800 20px/1.25 var(--font);letter-spacing:-.01em}
  .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
  .itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .itens li{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
  .itens li:last-child{border-bottom:0}
  .itens b{font-size:15px}
  .itens small{color:var(--muted);font-size:13px;grid-column:1}
  .itens .v{grid-row:1/span 2;grid-column:2;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .itens .v small{display:block}
  .tots{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .tots div{display:flex;justify-content:space-between;font-size:14px}
  .tots .t{background:var(--red);color:#fff;border-radius:12px;padding:14px 16px;margin-top:6px;align-items:baseline}
  .tots .t span{font:800 11px var(--font);letter-spacing:.14em;text-transform:uppercase}
  .tots .t b{font:900 26px var(--font);letter-spacing:-.01em}
  .blocos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .bloco{background:var(--soft);border-radius:12px;padding:12px 14px}
  .bloco h3{margin:0 0 3px;font:800 10.5px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
  .bloco p{margin:0;font-size:14px;white-space:pre-line}
  .bloco.largo{grid-column:1/-1}
  label{display:block;font:600 13px var(--font);margin:0 0 6px}
  input[type=text],input[type=email],input[type=tel],textarea{width:100%;font:500 16px var(--font);padding:13px 14px;border:1.5px solid #D4D4D4;border-radius:12px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .campos .largo{grid-column:1/-1}
  .check{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:14.5px}
  .check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--red);flex:none}
  .check.ok{border-color:var(--ok);background:#F1FAF3}
  .acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
  .b{appearance:none;border:1.5px solid #D4D4D4;background:#fff;color:var(--ink);font:700 15px var(--font);padding:13px 22px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:48px}
  .b.pri{background:var(--red);border-color:var(--red);color:#fff}
  .b.pri:hover{background:var(--red-d)}
  .b.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .b[disabled]{opacity:.5;cursor:not-allowed}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;font:500 14px var(--font);cursor:pointer;padding:8px 4px}
  .erro{color:var(--red);font-size:14px;margin:10px 0 0;min-height:1em}
  .assina{margin-top:14px;border:1.5px dashed #BDBDBD;border-radius:14px;padding:18px 16px 10px;background:#FCFCFC}
  .assina .nome{font:700 clamp(32px,7vw,44px)/1.1 var(--assina);color:#1A2B6B;min-height:48px;border-bottom:1.5px solid #9A9A9A;padding-bottom:6px;overflow-wrap:anywhere}
  .assina small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
  .cert{border:2px solid var(--ok);border-radius:16px;padding:18px;background:#F1FAF3}
  .cert h2{color:#0E7A2A}
  .cert dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:14px}
  .cert dt{color:var(--muted)}
  .cert dd{margin:0;font-weight:600;overflow-wrap:anywhere}
  .cert .nome{font:700 34px/1.1 var(--assina);color:#1A2B6B;margin-top:10px}
  .msg{text-align:center}
  .aviso{background:#FFF7E6;border:1px solid #F5C26B;border-radius:12px;padding:12px 14px;font-size:14px}
  .rodape{text-align:center;color:var(--muted);font-size:12.5px;padding:10px}
  .h3{margin:6px 0 0;font:800 10.5px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
  .campos .cid{display:grid;grid-template-columns:1fr 76px;gap:12px}
  .dica{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;min-height:1em}
  .opcoes{display:flex;flex-direction:column;gap:10px}
  .opc{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;margin:0;font-weight:400}
  .opc input{grid-row:1/span 2;width:22px;height:22px;margin:1px 0 0;accent-color:var(--red)}
  .opc.on{border-color:var(--red);background:#EAF3FD}
  .opc-t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:15.5px}
  .opc-v{font-weight:800;white-space:nowrap}
  .opc-v.gratis{color:var(--ok)}
  .opc small{grid-column:2;color:var(--muted);font-size:13.5px;line-height:1.45}
  .pagto{border:2px solid var(--red)}
  .pagto.ok{border-color:var(--ok);background:#F1FAF3}
  .pagto.ok h2{color:#0E7A2A}
  .tots{margin-top:14px}
  [hidden]{display:none!important}
  @media (max-width:600px){.card{padding:18px}.campos,.blocos{grid-template-columns:1fr}.passos li{font-size:10px}.passos{gap:2px}.campos .cid{grid-template-columns:1fr 76px}.acoes .b{flex:1 1 auto;justify-content:center}}
  @media print{body{background:#fff}.topo{background:#0A0A0A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding-bottom:24px}main{margin-top:12px}.acoes,.passos,.nao-imprime{display:none!important}.card{box-shadow:none;break-inside:avoid}}
</style>
<link rel="stylesheet" href="japy-tema.css">
</head>
<body>
<header class="topo"><div class="topo-in">
  <div id="logo"><img src="logo-escuro.png" alt="" onerror="this.parentNode.innerHTML='<span class=nome-emp>GUXTA</span>'"></div>
  <div><p class="eyebrow" id="eyebrow">Proposta</p><h1 id="titulo">Carregando a proposta…</h1><p id="sub"></p></div>
</div></header>
<main id="main" aria-live="polite"><section class="card msg">Carregando…</section></main>
<p class="rodape" id="rodape"></p>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const N=v=>Number(v)||0;
  const brl=v=>N(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const qtd=v=>N(v).toLocaleString("pt-BR",{maximumFractionDigits:2});
  const dmy=iso=>{if(!iso)return"";const [y,m,d]=String(iso).slice(0,10).split("-");return d+"/"+m+"/"+y};
  const quando=iso=>{const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
  const nro=n=>String(n||0).padStart(4,"0");
  const sp=t=>String(t||"").trim().replace(/[.;\s]+$/,"");
  const cfg=window.GLARA_CONFIG||{};
  const urlSupabase=u=>{u=String(u||"").trim();let m=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);if(m)return "https://"+m[1]+".supabase.co";m=u.match(/^(?:https?:\/\/)?([a-z0-9-]+\.supabase\.(?:co|in))/i);if(m)return "https://"+m[1].toLowerCase();return u.replace(/\/+$/,"")};
  const main=$("#main");
  const msg=(t,h)=>{$("#titulo").textContent=t;main.innerHTML=`<section class="card msg">${h||""}</section>`};
  const token=new URLSearchParams(location.search).get("t")||"";
  if(!window.supabase||!cfg.supabaseUrl)return msg("Proposta indisponível","Não foi possível carregar agora. Tente de novo em alguns minutos.");
  if(!/^[0-9a-f-]{36}$/i.test(token))return msg("Link incompleto","Confira se você copiou o link inteiro que recebeu.");
  const sb=window.supabase.createClient(urlSupabase(cfg.supabaseUrl),String(cfg.supabaseAnonKey||"").trim(),{auth:{persistSession:false}});
  const {data:o,error}=await sb.rpc("proposta_ver",{p_token:token});
  if(error||!o)return msg("Proposta não encontrada","Este link não está mais ativo. Fale com quem enviou a proposta para receber um novo.");
  const e=o.empresa||{}, emp=e.nome||cfg.marca||"GUXTA";
  document.title=`Proposta Nº ${nro(o.numero)} · ${emp}`;
  $("#eyebrow").textContent=`Proposta Nº ${nro(o.numero)} · ${emp}`;
  $("#titulo").textContent=o.titulo||"Sua proposta";
  $("#sub").textContent=`Para ${o.cliente_nome||"você"}${o.validade?" · válida até "+dmy(o.validade):""}`;
  $("#rodape").innerHTML=[`<b>${esc(emp)}</b>`,e.documento,e.telefone,e.email,e.site].filter(Boolean).map(x=>x.startsWith("<b>")?x:esc(x)).join(" · ");

  let passo=1;const dados={nome:"",documento:"",email:"",telefone:"",empresa:"",end:{cep:"",rua:"",numero:"",complemento:"",bairro:"",cidade:"",uf:"",referencia:""}};let aceite=false, entrega="";
  const ent=o.entrega||{}, temEnt=o.tem_entrega!==false, frete=()=>entrega==="entrega"?N(ent.valor):0, totalFinal=()=>N(o.total)+frete();
  const ETAPAS=[["proposta","Proposta"],["aceite","Aceite"],["dados","Seus dados"],...(temEnt?[["entrega","Entrega"]]:[]),["assinar","Assinatura"],["pagar","Pagamento"]];
  const etapa=()=>ETAPAS[passo-1][0], num=k=>ETAPAS.findIndex(x=>x[0]===k)+1;
  const passosHTML=()=>`<ol class="passos" style="grid-template-columns:repeat(${ETAPAS.length},1fr)" aria-label="Etapas">${ETAPAS.map(([,t],k)=>`<li class="${k+1<passo?"feito":k+1===passo?"atual":""}"${k+1===passo?' aria-current="step"':""}>${t}</li>`).join("")}</ol>`;
  const resumoHTML=()=>`<ul class="itens">${(o.itens||[]).map(i=>`<li><b>${esc(i.nome)}</b>${i.descricao?`<small>${esc(i.descricao)}</small>`:""}
      <span class="v"><b>${brl(N(i.qtd)*N(i.preco))}</b><small>${qtd(i.qtd)} ${esc(i.unidade||"")} × ${brl(i.preco)}</small></span></li>`).join("")}</ul>
    <div class="tots">${N(o.desconto)?`<div><span>Subtotal</span><b>${brl(o.subtotal)}</b></div><div><span>Desconto</span><b>− ${brl(o.desconto)}</b></div>`:""}
      ${N(o.entrega_valor)?`<div><span>Entrega</span><b>${brl(o.entrega_valor)}</b></div>`:frete()?`<div><span>Entrega</span><b>${brl(frete())}</b></div>`:""}
      <div class="t"><span>Total</span><b>${brl(N(o.total)+(N(o.entrega_valor)||frete()))}</b></div></div>
    <div class="blocos">
      <div class="bloco"><h3>Pagamento</h3><p>${esc(o.condicoes||"Pagamento integral na aprovação.")}</p></div>
      ${o.prazo_entrega?`<div class="bloco"><h3>Prazo de entrega</h3><p>${esc(o.prazo_entrega)}</p></div>`:""}
      ${o.observacoes?`<div class="bloco largo"><h3>Observações</h3><p>${esc(o.observacoes)}</p></div>`:""}
    </div>`;
  const cepFmt=c=>{c=String(c||"").replace(/\D/g,"").slice(0,8);return c.length>5?c.slice(0,5)+"-"+c.slice(5):c};
  const endTxt=a=>[[a.rua,a.numero].filter(Boolean).join(", "),a.complemento,a.bairro,[a.cidade,a.uf].filter(Boolean).join("/"),a.cep?"CEP "+cepFmt(a.cep):""].filter(Boolean).join(" · ");
  const docFmt=d=>{d=String(d||"").replace(/\D/g,"");if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4");if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,"$1.$2.$3/$4-$5");return d};
  function cpfOk(c){c=c.replace(/\D/g,"");if(c.length!==11||/^(\d)\1+$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);let d=(s*10)%11%10;if(d!==+c[9])return false;s=0;for(let i=0;i<10;i++)s+=+c[i]*(11-i);d=(s*10)%11%10;return d===+c[10]}
  function cnpjOk(c){c=c.replace(/\D/g,"");if(c.length!==14||/^(\d)\1+$/.test(c))return false;const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)===+c[12]&&calc(13)===+c[13]}
  const docOk=d=>{d=String(d||"").replace(/\D/g,"");return d.length===11?cpfOk(d):d.length===14?cnpjOk(d):false};

  function pagamentoHTML(){const pg=o.pagamento;
    if(pg&&pg.status==="pago")return `<section class="card pagto ok"><h2>✓ Pagamento confirmado</h2><p class="sub" style="margin:0">Recebemos ${brl(pg.valor)}${pg.pago_via?" · "+esc(pg.pago_via):""}. Obrigado!</p></section>`;
    if(pg&&pg.token&&o.online)return `<section class="card pagto" id="pagto"><h2>Pagamento</h2>
      <p class="sub">Falta só pagar <b>${brl(pg.valor)}</b> (valor integral). Escolha <b>Pix</b>, <b>cartão de crédito</b> ou <b>boleto</b>, pelo Mercado Pago. A confirmação é automática.</p>
      <div class="acoes" style="margin-top:6px"><a class="b pri" href="pagar.html?t=${esc(pg.token)}">Pagar agora · ${brl(pg.valor)} →</a></div></section>`;
    return `<section class="card pagto"><h2>Pagamento</h2><p class="sub" style="margin:0">A equipe vai enviar a forma de pagamento${pg?` de <b>${brl(pg.valor)}</b>`:""} em seguida.${e.telefone?" Qualquer dúvida: "+esc(e.telefone)+".":""}</p></section>`}
  function entregaResumo(){if(o.entrega_tipo==="retirada")return `<dt>Recebimento</dt><dd>Retirada sem custo${ent.retirada_endereco?" · "+esc(ent.retirada_endereco):""}</dd>`;
    if(o.entrega_tipo==="entrega")return `<dt>Recebimento</dt><dd>Entrega (${brl(o.entrega_valor)})</dd>`;return ""}
  function render(){
    if(o.status==="aprovado"&&o.assinado_em){const a=o.assinatura||{};
      main.innerHTML=`${o.pagamento&&o.pagamento.status!=="pago"&&o.online?pagamentoHTML():""}<section class="card cert"><h2>✓ Proposta assinada</h2><p class="sub" style="margin:0">Obrigado! Já está tudo registrado e a equipe foi avisada.</p>
        <div class="nome">${esc(a.nome||"")}</div>
        <dl><dt>Assinado por</dt><dd>${esc(a.nome||"")}</dd><dt>${String(a.documento||"").length>11?"CNPJ":"CPF"}</dt><dd>${esc(a.documento||"")}</dd>
          ${a.empresa?`<dt>Empresa</dt><dd>${esc(a.empresa)}</dd>`:""}<dt>Data e hora</dt><dd>${quando(o.assinado_em)}</dd><dt>Valor</dt><dd>${brl(N(o.total)+N(o.entrega_valor))}</dd>
          ${entregaResumo()}<dt>Proposta</dt><dd>Nº ${nro(o.numero)}${o.titulo?" · "+esc(o.titulo):""}</dd></dl>
        ${o.entrega_tipo==="retirada"&&(ent.retirada_endereco||ent.retirada_info)?`<div class="aviso" style="margin-top:12px"><b>Onde retirar:</b> ${esc(ent.retirada_endereco||"")}${ent.retirada_info?`<br>${esc(ent.retirada_info)}`:""}</div>`:""}
        <div class="acoes"><button class="b" type="button" onclick="window.print()">Salvar comprovante (PDF)</button></div></section>
        ${o.pagamento&&o.pagamento.status!=="pago"&&o.online?"":pagamentoHTML()}
        <section class="card"><h2>O que foi contratado</h2>${resumoHTML()}</section>`;return}
    if(o.status==="recusado"){main.innerHTML=`<section class="card msg"><h2>Proposta recusada</h2><p class="sub">Obrigado pelo retorno. Se mudar de ideia, fale com a gente: ${esc(e.telefone||e.email||emp)}.</p></section>`;return}
    if(o.vencida){main.innerHTML=`<section class="card msg"><h2>Esta proposta venceu</h2><p class="sub">Ela era válida até ${dmy(o.validade)}. Peça uma proposta atualizada: ${esc(e.telefone||e.email||emp)}.</p></section>
      <section class="card"><h2>O que estava na proposta</h2>${resumoHTML()}</section>`;return}
    let corpo="";const et=etapa(), d=dados.end;
    if(et==="proposta")corpo=`<h2>Confira a proposta</h2><p class="sub">Veja os itens, o valor e as condições. Se estiver tudo certo, siga para aceitar.</p>${resumoHTML()}
      <div class="acoes"><button class="b pri" data-ir="${num("aceite")}">Aceitar a proposta →</button><button class="link" data-recusar>Não tenho interesse</button></div>
      <div id="recusa" hidden><label for="motivo" style="margin-top:14px">Pode contar o motivo? (opcional)</label><textarea id="motivo" rows="3" placeholder="Ex.: o valor ficou acima do que eu esperava"></textarea>
        <div class="acoes"><button class="b" data-recusa-ok>Recusar a proposta</button><button class="link" data-recusa-x>Voltar</button></div></div>`;
    if(et==="aceite")corpo=`<h2>Aceite</h2><p class="sub">Leia e marque para continuar.</p>
      <label class="check${aceite?" ok":""}" id="aceite-box"><input type="checkbox" id="aceite" ${aceite?"checked":""}><span>Li e aceito a proposta Nº ${nro(o.numero)} de <b>${esc(emp)}</b>, no valor de <b>${brl(o.total)}</b>${temEnt?" (mais a entrega, se eu escolher receber no meu endereço)":""}, com pagamento integral${o.prazo_entrega?`, e prazo de entrega: ${esc(sp(o.prazo_entrega))}`:""}.</span></label>
      <div class="acoes"><button class="b pri" data-ir="${num("dados")}" ${aceite?"":"disabled"} id="ir3">Continuar →</button><button class="link" data-ir="${num("proposta")}">Voltar</button></div>`;
    if(et==="dados")corpo=`<h2>Seus dados</h2><p class="sub">Cadastro para a assinatura, a cobrança e a entrega.</p>
      <form id="f-dados" class="campos" novalidate>
        <div class="largo"><label for="d-nome">Nome completo</label><input type="text" id="d-nome" autocomplete="name" value="${esc(dados.nome)}" required></div>
        <div><label for="d-doc">CPF ou CNPJ</label><input type="text" id="d-doc" inputmode="numeric" value="${esc(docFmt(dados.documento))}" required></div>
        <div><label for="d-emp">Empresa (se for o caso)</label><input type="text" id="d-emp" autocomplete="organization" value="${esc(dados.empresa)}"></div>
        <div><label for="d-email">E-mail</label><input type="email" id="d-email" autocomplete="email" value="${esc(dados.email)}"></div>
        <div><label for="d-tel">WhatsApp</label><input type="tel" id="d-tel" autocomplete="tel" inputmode="tel" value="${esc(dados.telefone)}" required></div>
        <div class="largo sep"><h3 class="h3">Endereço</h3></div>
        <div><label for="d-cep">CEP</label><input type="text" id="d-cep" inputmode="numeric" autocomplete="postal-code" value="${esc(cepFmt(d.cep))}" placeholder="00000-000" required><small class="dica" id="cep-dica"></small></div>
        <div><label for="d-rua">Rua / avenida</label><input type="text" id="d-rua" autocomplete="address-line1" value="${esc(d.rua)}" required></div>
        <div><label for="d-num">Número</label><input type="text" id="d-num" inputmode="numeric" value="${esc(d.numero)}" required></div>
        <div><label for="d-comp">Complemento</label><input type="text" id="d-comp" autocomplete="address-line2" value="${esc(d.complemento)}" placeholder="Apto, sala, bloco"></div>
        <div><label for="d-bai">Bairro</label><input type="text" id="d-bai" value="${esc(d.bairro)}"></div>
        <div class="cid"><div><label for="d-cid">Cidade</label><input type="text" id="d-cid" autocomplete="address-level2" value="${esc(d.cidade)}" required></div>
          <div><label for="d-uf">UF</label><input type="text" id="d-uf" maxlength="2" autocomplete="address-level1" value="${esc(d.uf)}"></div></div>
        <div class="largo"><label for="d-ref">Ponto de referência (opcional)</label><input type="text" id="d-ref" value="${esc(d.referencia)}"></div>
      </form><p class="erro" id="erro"></p>
      <div class="acoes"><button class="b pri" data-ir="${passo+1}">Continuar →</button><button class="link" data-ir="${num("aceite")}">Voltar</button></div>`;
    if(et==="entrega"){const podeEnt=ent.ativa!==false;
      corpo=`<h2>Como você quer receber?</h2><p class="sub">O material fica pronto no prazo combinado. Escolha uma opção.</p>
      <div class="opcoes" role="radiogroup" aria-label="Retirada ou entrega">
        <label class="opc${entrega==="retirada"?" on":""}"><input type="radio" name="ent" value="retirada" ${entrega==="retirada"?"checked":""}>
          <span class="opc-t"><b>Retirar no nosso endereço</b><span class="opc-v gratis">Sem custo</span></span>
          <small>${esc(ent.retirada_endereco||"Combinamos o endereço com você.")}${ent.retirada_info?`<br>${esc(ent.retirada_info)}`:""}</small></label>
        ${podeEnt?`<label class="opc${entrega==="entrega"?" on":""}"><input type="radio" name="ent" value="entrega" ${entrega==="entrega"?"checked":""}>
          <span class="opc-t"><b>Receber no meu endereço</b><span class="opc-v">${N(ent.valor)?"+ "+brl(ent.valor):"Grátis"}</span></span>
          <small>${esc(endTxt(d))}${ent.info?`<br>${esc(ent.info)}`:""}</small></label>`:""}
      </div><p class="erro" id="erro"></p>
      <div class="tots"><div class="t"><span>Total a pagar</span><b>${brl(totalFinal())}</b></div></div>
      <div class="acoes"><button class="b pri" data-ir="${num("assinar")}">Continuar →</button><button class="link" data-ir="${num("dados")}">Voltar</button></div>`}
    if(et==="assinar")corpo=`<h2>Assinatura</h2><p class="sub">Confira como fica a sua assinatura. Ao clicar em Assinar, registramos seu nome, documento, data, hora e o endereço de internet de onde você assinou.</p>
      <div class="assina"><div class="nome">${esc(dados.nome)}</div><small>${esc(dados.nome)} · ${String(dados.documento).length>11?"CNPJ":"CPF"} ${esc(docFmt(dados.documento))}</small></div>
      <div class="tots"><div><span>Proposta</span><b>${brl(o.total)}</b></div>${temEnt?`<div><span>${entrega==="entrega"?"Entrega no seu endereço":"Retirada no nosso endereço"}</span><b>${frete()?brl(frete()):"Sem custo"}</b></div>`:""}
        <div class="t"><span>Total a pagar</span><b>${brl(totalFinal())}</b></div></div>
      <p class="sub" style="margin:12px 0 0">Depois de assinar, você já paga o valor integral por Pix, cartão ou boleto.</p>
      <p class="erro" id="erro"></p>
      <div class="acoes"><button class="b ok" id="assinar">✍ Assinar e ir para o pagamento</button><button class="link" data-ir="${passo-1}">Voltar</button></div>`;
    main.innerHTML=`<section class="card">${passosHTML()}</section><section class="card">${corpo}</section>`;
  }
  function lerDados(){const v=id=>(($("#"+id)||{}).value||"").trim();if(!$("#d-nome"))return;
    Object.assign(dados,{nome:v("d-nome"),documento:v("d-doc").replace(/\D/g,""),empresa:v("d-emp"),email:v("d-email"),telefone:v("d-tel")});
    Object.assign(dados.end,{cep:v("d-cep").replace(/\D/g,""),rua:v("d-rua"),numero:v("d-num"),complemento:v("d-comp"),bairro:v("d-bai"),cidade:v("d-cid"),uf:v("d-uf").toUpperCase(),referencia:v("d-ref")})}
  function validarDados(){const er=$("#erro"), d=dados.end;const f=(t,id)=>{er.textContent=t;$("#"+id).focus();return false};
    if(dados.nome.split(/\s+/).filter(Boolean).length<2)return f("Escreva o nome completo.","d-nome");
    if(!docOk(dados.documento))return f("Confira o CPF ou o CNPJ: o número não está válido.","d-doc");
    if(dados.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(dados.email))return f("Confira o e-mail.","d-email");
    if(dados.telefone.replace(/\D/g,"").length<10)return f("Informe o WhatsApp com DDD.","d-tel");
    if(d.cep.length!==8)return f("Confira o CEP (8 números).","d-cep");
    if(!d.rua)return f("Informe a rua.","d-rua");if(!d.numero)return f("Informe o número (ou s/n).","d-num");if(!d.cidade)return f("Informe a cidade.","d-cid");
    return true}
  let cepUlt="";
  async function buscarCep(c){if(c===cepUlt)return;cepUlt=c;const dica=$("#cep-dica");dica&&(dica.textContent="Buscando o endereço…");
    try{const r=await fetch("https://viacep.com.br/ws/"+c+"/json/");const j=await r.json();if(c!==cepUlt)return;
      if(j.erro){dica&&(dica.textContent="CEP não encontrado. Preencha o endereço.");return}
      const p=(id,v)=>{const i=$("#"+id);if(i&&v&&!i.value)i.value=v};p("d-rua",j.logradouro);p("d-bai",j.bairro);p("d-cid",j.localidade);p("d-uf",j.uf);
      dica&&(dica.textContent="");const n=$("#d-num");n&&!n.value&&n.focus()}
    catch(_){dica&&(dica.textContent="")}}
  main.addEventListener("click",async ev=>{
    const ir=ev.target.closest("[data-ir]");
    if(ir){ev.preventDefault();const p=+ir.dataset.ir;
      if(etapa()==="dados"){lerDados();if(p>passo&&!validarDados())return}
      if(etapa()==="entrega"&&p>passo&&!entrega){$("#erro").textContent="Escolha retirada ou entrega.";return}
      passo=p;render();window.scrollTo({top:0,behavior:"smooth"});return}
    if(ev.target.closest("[data-recusar]")){$("#recusa").hidden=false;$("#motivo").focus();return}
    if(ev.target.closest("[data-recusa-x]")){$("#recusa").hidden=true;return}
    if(ev.target.closest("[data-recusa-ok]")){const b=ev.target.closest("button");b.disabled=true;
      const r=await sb.rpc("proposta_recusar",{p_token:token,p_motivo:($("#motivo").value||"").trim()});
      if(r.error){b.disabled=false;alertar("Não deu para registrar agora. Tente de novo.");return}o.status="recusado";render();return}
    if(ev.target.closest("#assinar")){const b=$("#assinar");b.disabled=true;b.textContent="Assinando…";
      const r=await sb.rpc("proposta_assinar",{p_token:token,p_nome:dados.nome,p_documento:dados.documento,p_email:dados.email,p_telefone:dados.telefone,p_endereco:endTxt(dados.end),p_empresa:dados.empresa,p_aceite:aceite,
        p_entrega:temEnt?entrega:"",p_entrega_end:entrega==="entrega"?dados.end:{}});
      if(r.error){b.disabled=false;b.textContent="✍ Assinar e ir para o pagamento";const m=r.error.message||"";
        $("#erro").textContent=/ja_assinada/.test(m)?"Esta proposta já foi assinada. Recarregue a página.":/vencida/.test(m)?"A proposta venceu. Peça uma atualizada.":/documento/.test(m)?"Confira o CPF ou CNPJ.":/endereco_entrega/.test(m)?"Confira o endereço de entrega.":/entrega/.test(m)?"Escolha retirada ou entrega.":"Não deu para assinar agora. Verifique a internet e tente de novo.";return}
      const v=await sb.rpc("proposta_ver",{p_token:token});if(!v.error&&v.data)Object.assign(o,v.data);else{o.status="aprovado";o.assinado_em=new Date().toISOString();o.assinatura={nome:dados.nome,documento:"•••"+dados.documento.slice(-4)};o.pagamento=r.data&&r.data.pagamento;o.entrega_tipo=entrega;o.entrega_valor=frete()}
      render();window.scrollTo({top:0,behavior:"smooth"});return}
  });
  const alertar=t=>{const er=$("#erro");if(er)er.textContent=t};
  main.addEventListener("change",ev=>{if(ev.target.id==="aceite"){aceite=ev.target.checked;$("#aceite-box").classList.toggle("ok",aceite);$("#ir3").disabled=!aceite}
    if(ev.target.name==="ent"){entrega=ev.target.value;render()}});
  main.addEventListener("input",ev=>{if(ev.target.id==="d-doc"){const d=ev.target.value.replace(/\D/g,"").slice(0,14);if(d.length===11||d.length===14)ev.target.value=docFmt(d)}
    if(ev.target.id==="d-cep"){const c=ev.target.value.replace(/\D/g,"").slice(0,8);ev.target.value=cepFmt(c);if(c.length===8)buscarCep(c)}});
  main.addEventListener("submit",ev=>{ev.preventDefault();const b=main.querySelector('.acoes [data-ir].pri');b&&b.click()});
  render();
})();
</script>
<script src="ajuste-cores.js"></script>
</body>
</html>
