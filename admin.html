<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Painel de gestão · Hub de Marketing</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">

<link rel="stylesheet" href="tema-claro.css">
<link rel="stylesheet" href="tema-escuro.css">

<style>
  .cli-acoes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .status.ativo{background:#E7F6EC;color:#14783B}
  .status.ativo::before{content:"";width:7px;height:7px;border-radius:50%;background:#1FA750}
  .status.inativo{background:#F1F1F3;color:#6E6E73}
  .icone-lixo{appearance:none;border:1px solid var(--line);background:#FFFFFF;color:#8A8A90;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
  .icone-lixo:hover{color:#C62A35;border-color:#F3C9CC;background:#FDEEEF}
  .aviso-inativo{margin:0;padding:10px 14px;border-radius:8px;background:#F4F4F6;color:#4A4A4F;font-size:14px}
  .cli small{color:#8A8A90;font-weight:500}
  .wrap{max-width:1240px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
  .layout>*{min-width:0}
  #main .tabs{flex-wrap:wrap;overflow:visible}#main .tab{font-size:15px;padding:12px 12px}
  .side{display:flex;flex-direction:column;gap:8px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:2px 6px 8px 2px;margin:-2px -6px 0 -2px}
  /* com o painel aberto, o cabeçalho grande some em todas as telas: o menu fica sempre no mesmo lugar */
  .wrap:has(#painel:not([hidden])) .hero{display:none}
  @media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static}}
  .cli{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:500 14px var(--font);text-transform:none;letter-spacing:-.005em;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .cli[aria-current="true"]{background:var(--navy,#0B0E2C);color:#FFFFFF;border-color:var(--navy,#0B0E2C);box-shadow:inset 4px 0 0 var(--accent-2,#6C78FF),0 8px 20px -10px rgba(39,51,230,.6)}
  .cli small{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
  .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
  .row > div{flex:1 1 160px;min-width:0}
  .acessos{display:flex;flex-direction:column;gap:6px}
  .acesso-bts{display:flex;gap:6px;flex-wrap:wrap}
  .tag-temp{display:inline-block;font-size:11px;font-weight:700;color:#B45309;background:#FFF8EE;border:1px solid #F3D7B5;border-radius:999px;padding:2px 8px;margin-left:4px}
  html[data-tema="escuro"] .tag-temp{background:rgba(217,119,6,.14);color:#FBBF24;border-color:rgba(217,119,6,.35)}
  .acesso{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
  .linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .linkbox code{background:var(--soft);padding:8px 10px;border-radius:8px;font-size:13px;word-break:break-all;flex:1 1 280px}
  .thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
  .thumb{flex:0 0 auto;width:120px;display:flex;flex-direction:column;gap:6px}
  .thumb img,.thumb video{width:120px;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:var(--line);display:block}
  .thumb video{aspect-ratio:9/16;background:#000;object-fit:contain}
  .thumb.vid{width:140px}.thumb.vid video{width:140px}
  .thumb .actions{gap:4px;justify-content:center}
  .thumb .btn{padding:4px 8px;font-size:12px}
  .addthumb{width:120px;aspect-ratio:4/5;border:1.5px dashed var(--accent);border-radius:10px;display:grid;place-items:center;text-align:center;font:600 12px var(--font);text-transform:none;letter-spacing:0;color:var(--accent);cursor:pointer;padding:8px}
  .rows{display:flex;flex-direction:column;gap:8px}
  .brow{display:grid;grid-template-columns:90px minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:start}
  .srow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:start}
  @media (max-width:640px){.brow,.srow{grid-template-columns:1fr}}
  .brow textarea,.srow textarea{min-height:60px}
  .head{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}
  .pill-sm{font-size:12px}
  .toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:90vw}
</style>

<body>
<div class="wrap">
  <div class="top">
    <div class="brandbar"><img class="logo" src="logo.png" alt="GUXTA HUB" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='logo.svg'}else{this.remove()}"><span class="eyebrow marca-tag" id="marca">Onde estratégia, criação e gestão se encontram</span></div>
    <div class="actions"><div class="sino-box av-box" id="av-box" hidden></div><button type="button" class="tema-btn" data-tema-btn></button><div class="actions" id="userbox" hidden><span class="perfil-av" id="perfil-av" aria-hidden="true"></span><button class="btn small ghost" id="meu-perfil" hidden>Meu perfil</button><span class="note" id="useremail"></span><button class="btn small" id="sair">Sair</button></div></div>
  </div>
  <header class="hero hero-sm"><span class="hero-tag">Uso interno · GUXTA</span><h1>Painel de <mark>gestão</mark></h1><p class="intro" id="hero-sub">Hub de Marketing · clientes, planejamento, aprovações, resultados, anúncios e pedidos num lugar só.</p></header>

  <!-- LOGIN -->
  <form id="login" class="card" style="max-width:420px" hidden>
    <h2>Entrar</h2>
    <div><label class="label" for="email">E-mail</label><input type="email" id="email" autocomplete="username" required></div>
    <div><label class="label" for="senha">Senha</label><input type="password" id="senha" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Entrar</button>
    <p class="note" id="login-msg"></p>
  </form>

  <div id="painel" class="layout" hidden>
    <aside class="side">
      <div class="side-ola" aria-label="Saudação"><span class="side-av" id="side-av" aria-hidden="true">G</span><span class="side-ola-t"><small id="side-sauda">Olá,</small><b id="side-nome">Gustavo</b></span></div>
      <span class="side-sec">Operação</span>
      <button class="cli cli-tarefas" id="btn-inicio" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Início</button>
      <button class="cli cli-tarefas" id="btn-meudia" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Meu dia<span class="badge" id="md-badge" hidden></span></button>
      <button class="cli cli-tarefas" id="btn-tarefas" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>Minhas tarefas<span class="badge" id="tk-badge" hidden></span></button>
      <button class="cli cli-tarefas" id="btn-agenda" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h2M12 14h2M16 14h2M8 18h2M12 18h2"/></svg></span>Agenda</button>
      <button class="cli cli-tarefas" id="btn-clientes" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21v-1a6 6 0 0 1 12 0v1"/><circle cx="9" cy="8" r="4"/><path d="M17 11a3 3 0 1 0 0-6"/><path d="M21 21v-1a5 5 0 0 0-3.5-4.8"/></svg></span>Clientes<span class="badge" id="cli-badge" hidden></span></button>
      <button class="cli cli-tarefas" id="btn-aprovacoes" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg></span>Aprovações<span class="badge" id="ap-badge" hidden></span></button>
      <span class="side-sec">Comercial</span>
      <button class="cli cli-tarefas" id="btn-crm" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>CRM · Contatos<span class="badge" id="crm-badge" hidden></span></button>
      <button class="cli cli-tarefas" id="btn-orcamentos" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>Orçamentos<span class="badge" id="orc-badge" hidden></span></button>
      <button class="cli cli-tarefas" id="btn-loja" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v8h14v-8M10 21v-5h4v5"/></svg></span>Loja</button>
      <button class="cli cli-tarefas" id="btn-midia" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"/><path d="M7 12.5V18a2 2 0 0 0 4 0v-4"/><path d="M21 9v6"/></svg></span>Planos e mídia</button>
      <span class="side-sec">Gestão</span>
      <button class="cli cli-tarefas" id="btn-financeiro" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg></span>Financeiro<span class="badge" id="fin-badge" hidden></span></button>
      <button class="cli cli-tarefas" id="btn-notas" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5z"/><path d="M15 3v6h6M7 13h10M7 17h6"/></svg></span>Notas</button>
      <button class="cli cli-tarefas" id="btn-avisos" aria-current="false"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>Avisos e lembretes<span class="badge calma" id="av-badge" hidden></span></button>
      <a class="cli cli-tarefas" href="https://mail.google.com/mail/u/0/" target="_blank" rel="noopener" style="text-decoration:none" title="Abre o Gmail, que recebe os e-mails de contato@guxta.com.br em outra aba"><span class="cli-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>Caixa de entrada<span class="note" style="margin-left:auto;font-size:11px">Gmail ↗</span></a>
    </aside>

    <main class="list" id="main">
      <div class="empty">Escolha um cliente ou adicione um novo.</div>
    </main>
  </div>
</div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const urlSupabase=u=>{u=String(u||"").trim();let m=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);if(m)return "https://"+m[1]+".supabase.co";m=u.match(/^(?:https?:\/\/)?([a-z0-9-]+\.supabase\.(?:co|in))/i);if(m)return "https://"+m[1].toLowerCase();return u.replace(/\/+$/,"")};
  const cfg=window.GLARA_CONFIG||{};
  const PADRAO_COR=["","#FF6B2C","#FF6B2C","#FF6B2C","#C0703A","#3D4BFF","#0F8A4A","#0866FF","#1877F2"];
  $("#hero-sub").textContent=(cfg.plataforma||"Hub de Marketing")+" · clientes, planejamento, aprovações, resultados, anúncios e pedidos num lugar só.";
  let toastT=null;
  const AVISO_NAO_SUCESSO=/^(Não|Preencha|Escreva|Escolha|Envie|Informe|Digite|O nome não|O link precisa|Este e-mail|Nada novo|Lendo|Excluindo|Selecionei|Publique|Cliente não|Erro|Falha)/i;
  function tituloConfirma(m){
    if(/apag/i.test(m))return "Apagado";
    if(/copi/i.test(m))return "Copiado!";
    if(/enviad|envi/i.test(m))return "Enviado!";
    if(/criad|novo/i.test(m))return "Criado!";
    if(/atualiz/i.test(m))return "Atualizado!";
    if(/salv|registr/i.test(m))return "Salvo!";
    return "Pronto!";
  }
  const toast=m=>{
    const t=$("#toast");
    if(window.GlaraConfirma&&m){
      if(!AVISO_NAO_SUCESSO.test(m)){GlaraConfirma.mostrar({titulo:tituloConfirma(m),texto:m,ms:6000});return}
      var erro=/^(Não deu|Erro|Falha|O link precisa|Não achei|Não encontrei|Cliente não)/i.test(m);
      GlaraConfirma.mostrar({titulo:erro?"Não deu certo":"Atenção",texto:m,tipo:"erro",ms:7000});
      return;
    }
    t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)};
  const falha=(acao,error)=>{console.error(error);toast("Não deu para "+acao+". "+(error&&error.message?error.message:"Tente de novo."))};
  const portalURL=t=>new URL("index.html?c="+t,location.href).href;
  const loginURL=()=>new URL("index.html",location.href).href;
  const fmtQuando=iso=>{try{const d=new Date(iso);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}};

  if(!window.supabase||!cfg.supabaseUrl||/SEU-PROJETO/.test(cfg.supabaseUrl)){
    $("#main").innerHTML="";$("#login").hidden=false;$("#login-msg").textContent="Preencha o arquivo config.js com o endereço e a chave do Supabase antes de usar o painel.";return}
  let sb=null;
  const fetchComSessao=async(url,init)=>{
    const r=await fetch(url,init);
    if(r.status!==401&&r.status!==403)return r;
    const txt=await r.clone().text().catch(()=>"");
    if(!/jwt expired|token is expired/i.test(txt))return r;
    const {data,error}=await sb.auth.refreshSession().catch(()=>({data:null,error:true}));
    if(error||!data||!data.session)return r;
    const h=new Headers((init&&init.headers)||{});h.set("Authorization","Bearer "+data.session.access_token);
    return fetch(url,{...(init||{}),headers:h});
  };
  sb=window.supabase.createClient(urlSupabase(cfg.supabaseUrl),String(cfg.supabaseAnonKey||"").trim(),{global:{fetch:fetchComSessao}});
  window.__sbAdmin=sb;

  let avSino=null, finAbrir=null;
  let clientes=[], cliAtual=null, ciclos=[], cicloAtual=null, aba="posts", vista="inicio", alertas={clientes:{},tarefas:{}}, pedFiltro="abertos";
  let posts=[], decisoes={}, roteiros=[], stories=[], pedidos=[], anuncios=[], acessos=[], documentos=[];

  /* ---------- login ---------- */
  $("#login").addEventListener("submit",async e=>{
    e.preventDefault();$("#login-msg").textContent="Entrando…";
    const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#senha").value});
    if(error){const m=String(error.message||"");console.error(error);
      $("#login-msg").textContent=/invalid login credentials/i.test(m)?"E-mail ou senha incorretos. (Invalid login credentials)"
        :/not confirmed/i.test(m)?"Este e-mail ainda não foi confirmado no Supabase. (Email not confirmed)"
        :/api key|apikey|jwt/i.test(m)?"A chave do Supabase no config.js não foi aceita. ("+m+")"
        :/fetch|network|failed/i.test(m)?"Não consegui falar com o Supabase. Confira o endereço no config.js. ("+m+")"
        :"Erro do Supabase: "+m;return}
    iniciar();
  });
  $("#sair").addEventListener("click",async()=>{await sb.auth.signOut();location.reload()});

  async function iniciar(){
    const {data:{session}}=await sb.auth.getSession();
    if(!session){$("#login").hidden=false;$("#painel").hidden=true;$("#userbox").hidden=true;return}
    const {data:adm}=await sb.rpc("is_admin");
    if(!adm){$("#login").hidden=false;$("#login-msg").textContent="Este e-mail não está liberado como administrador. Veja o passo 4 do guia de instalação.";await sb.auth.signOut();return}
    {const nm=(cfg.nomeAdmin||session.user.email.split("@")[0]||"").trim(), h=new Date().getHours();
     $("#side-nome").textContent=nm.split(" ")[0]||"Olá";$("#side-sauda").textContent=(h<12?"Bom dia":h<18?"Boa tarde":"Boa noite")+",";$("#side-av").textContent=(nm[0]||"G").toUpperCase()}
    $("#login").hidden=true;$("#painel").hidden=false;$("#userbox").hidden=false;$("#useremail").textContent=session.user.email;
    if(window.GlaraPerfil)GlaraPerfil.iniciar(sb,session,{botao:"#meu-perfil",av:"#perfil-av",nome:"#side-nome",sidebar:"#side-av"});
    await carregarClientes();
    await sb.rpc("gerar_recorrencias"); // cria as mensalidades do mês dos planos recorrentes
    if(vista==="inicio")abrirInicio();
    if(window.GlaraAvisos&&!avSino)avSino=window.GlaraAvisos.sino($("#av-box"),sb,{clientes:()=>clientes,toast,falha,ir:irDestino});
    carregarAlertas();setInterval(()=>{if(!document.hidden)carregarAlertas()},60000);
  }

  /* ---------- contrato e documentos ---------- */
  const tamanho=b=>!b?"":b<1048576?Math.max(1,Math.round(b/1024))+" KB":(b/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB";

  function documentosHTML(){
    return `<section class="card">
      <div class="head"><h2>Contrato e documentos</h2><span class="note">${documentos.length?documentos.length+(documentos.length>1?" arquivos":" arquivo"):"Nenhum ainda"}</span></div>

        return `<div class="doc"><span class="doc-ico" aria-hidden="true">${esc(ext)}</span>
          <span class="doc-info"><b>${esc(d.titulo)}</b><small>${d.assinado_em?"Assinado em "+dataBR(d.assinado_em)+" · ":""}${esc(d.nome_arquivo)}${d.tamanho?" · "+tamanho(d.tamanho):""} · enviado em ${dataBR(d.criado_em)}</small></span>

        <div><label class="label" for="doc-titulo">Nome do documento</label><input type="text" id="doc-titulo" value="${documentos.length?"":"Contrato assinado"}" placeholder="Ex.: Aditivo de contrato"></div>

        <div><label class="label" for="doc-arq">Arquivo (PDF, JPG ou PNG, até 25 MB)</label><input type="file" id="doc-arq" accept="application/pdf,image/jpeg,image/png,image/webp"></div>
        <div><button class="btn primary small" data-act="enviar-doc">Anexar documento</button></div>

  async function enviarDocumento(btn){
    const f=$("#doc-arq").files[0], titulo=$("#doc-titulo").value.trim()||"Contrato assinado";
    if(!f){toast("Escolha o arquivo do contrato.");return}
    if(f.size>25*1048576){toast("Arquivo muito grande: o limite é 25 MB.");return}
    if(!/^(application\/pdf|image\/(jpeg|png|webp))$/.test(f.type)){toast("Envie um PDF ou uma imagem (JPG, PNG).");return}
    const limpo=f.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9._-]+/g,"-").replace(/^-+|-+$/g,"")||"documento";
    const caminho=cliAtual.id+"/"+Date.now()+"-"+limpo;
    btn.disabled=true;btn.textContent="Enviando…";
    const up=await sb.storage.from("documentos").upload(caminho,f,{contentType:f.type,upsert:false});
    if(up.error){btn.disabled=false;btn.textContent="Anexar documento";return falha("enviar o arquivo",up.error)}
    const {data,error}=await sb.from("documentos").insert({cliente_id:cliAtual.id,titulo,caminho,nome_arquivo:f.name,tipo_arquivo:f.type,tamanho:f.size,assinado_em:$("#doc-data").value||null}).select().single();
    if(error){await sb.storage.from("documentos").remove([caminho]);btn.disabled=false;btn.textContent="Anexar documento";return falha("salvar o documento",error)}
    documentos.unshift(data);render();toast(`“${titulo}” anexado. ${acessos.length?"O cliente já vê na aba Contrato.":"Libere um acesso com e-mail e senha para o cliente abrir."}`);
  }

  /* ---------- ciclo ---------- */
  async function carregarCiclo(){
    if(!cicloAtual){posts=[];roteiros=[];stories=[];decisoes={};render();return}
    const id=cicloAtual.id;
    const [p,r,s]=await Promise.all([
      sb.from("posts").select("*").eq("ciclo_id",id).order("data",{nullsFirst:false}).order("dia",{nullsFirst:false}).order("criado_em"),
      sb.from("roteiros").select("*").eq("ciclo_id",id).order("data",{nullsFirst:false}).order("dia",{nullsFirst:false}),
      sb.from("stories").select("*").eq("ciclo_id",id).order("data",{nullsFirst:false}).order("dia",{nullsFirst:false})]);
    const ad=await sb.from("anuncios").select("*").eq("ciclo_id",id).order("data");anuncios=ad.error?[]:ad.data;
    if(p.error||r.error||s.error)return falha("carregar o mês",p.error||r.error||s.error);
    posts=p.data;roteiros=r.data;stories=s.data;decisoes={};
    if(posts.length){const d=await sb.from("decisoes").select("*").in("post_id",posts.map(x=>x.id));if(!d.error)d.data.forEach(x=>decisoes[x.post_id]=x)}
    render();
  }

  }
  function render(){
    if(!cliAtual){$("#main").innerHTML=`<div class="empty">Escolha um cliente ou adicione um novo.</div>`;return}

  /* ---------- posts ---------- */
  const vigente=p=>{const d=decisoes[p.id];return d&&d.versao===p.versao?d:null};
  const estado=p=>{const d=vigente(p);return !d?"pend":d.decisao==="aprovado"?"ok":"adj"};
  function postsHTML(){
    const nAg=posts.filter(p=>p.publicacao==="agendado").length, nPub=posts.filter(p=>p.publicacao==="publicado").length, nOk=posts.filter(p=>estado(p)==="ok").length;
    return `<div class="actions"><button class="btn primary" data-act="novo-post">+ Novo post</button><button class="btn outline" data-act="novo-reels">+ Novo Reels (vídeo)</button>
      ${posts.length?`<span class="pub-resumo">${nOk} aprovado${nOk===1?"":"s"} · ${nAg} agendado${nAg===1?"":"s"} · ${nPub} publicado${nPub===1?"":"s"} de ${posts.length}</span>`:""}</div>`+
    (posts.length?posts.map(p=>{
      const d=decisoes[p.id], v=vigente(p), st=estado(p);
      const pill=st==="ok"?'<span class="status ok">Aprovado</span>':st==="adj"?'<span class="status adj">Ajuste pedido</span>':'<span class="status pend">Aguardando o cliente</span>';
      const pt=v&&v.partes&&v.partes.tema&&v.partes_em===v.em?v.partes:null;
      const ptHTML=pt?`<ul class="pt-res">${[["tema","Tema"],["arte",p.formato==="Reels"?"Vídeo":"Arte"],["legenda","Legenda"]].map(([k,t])=>{const x=pt[k]||{};return `<li class="pt-${esc(x.d||"ok")}"><span class="pt-ico" aria-hidden="true">${x.d==="alt"?"✎":x.d==="rep"?"✕":"✓"}</span><b>${t}</b><span>${x.d==="alt"?"alterar":x.d==="rep"?"reprovado":"aprovado"}</span>${x.c?`<q>${esc(x.c)}</q>`:""}</li>`}).join("")}</ul>`:"";
      const dec=v?`<p class="record">${v.decisao==="aprovado"?"Aprovado":"Ajuste pedido"}${v.nome?" por "+esc(v.nome):""} em ${fmtQuando(v.em)}.${!pt&&v.decisao==="ajuste"&&v.comentario?`<q>${esc(v.comentario)}</q>`:""}</p>${ptHTML}`
        :d?`<p class="record">Você alterou o post depois da última decisão (${d.decisao==="aprovado"?"aprovado":"ajuste pedido"} em ${fmtQuando(d.em)}). O cliente vai ver a nova versão.${d.decisao==="ajuste"&&d.comentario?`<q>${esc(d.comentario)}</q>`:""}</p>`:"";
      return `<article class="card" id="post-${p.id}">
        <div class="head"><h3>${p.dia!=null?"Post "+String(p.dia).padStart(2,"0")+" · ":""}${esc(p.titulo||"Post sem título")}</h3>${pill}</div>
        ${dec}
        <div><span class="label">${p.formato==="Reels"?"Vídeo do Reels (MP4 até 50 MB; pode juntar uma capa em imagem)":"Telas (na ordem do carrossel)"}</span>
          <div class="thumbs">${(p.slides||[]).map((u,i)=>`<div class="thumb${ehVideo(u)?" vid":""}">${ehVideo(u)?`<video src="${esc(u)}#t=0.5" controls playsinline preload="metadata" aria-label="Vídeo ${i+1}"></video>`:`<img src="${esc(u)}" alt="Tela ${i+1}" loading="lazy">`}
            <div class="actions"><button class="btn" data-act="sl-esq" data-id="${p.id}" data-i="${i}" aria-label="Mover para a esquerda" ${i===0?"disabled":""}>←</button>

          <div><label class="label" for="pd-${p.id}">Data de publicação</label><input type="date" id="pd-${p.id}" value="${esc(p.data||"")}"></div>
          <div><label class="label" for="pn-${p.id}">Post do ciclo (nº)</label><input type="number" min="1" max="200" id="pn-${p.id}" value="${p.dia??""}"></div>
        </div>
        <div><label class="label" for="pl-${p.id}">Legenda</label><textarea id="pl-${p.id}" style="min-height:130px">${esc(p.legenda)}</textarea></div>
        ${pubHTML(p,st)}
        <div class="actions"><button class="btn primary small" data-act="salvar-post" data-id="${p.id}">Salvar post</button>
          <button class="btn danger small" data-act="apagar-post" data-id="${p.id}">Apagar post</button>
          <span class="note">Mudar telas, vídeo, título ou legenda faz o cliente aprovar de novo.</span></div>
      </article>`}).join(""):`<div class="empty">Nenhum post neste mês. Clique em “+ Novo post”.</div>`);
  }
  const localDT=ts=>{if(!ts)return"";const d=new Date(ts);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
  function pubHTML(p,st){const pub=p.publicacao||"";

      <div class="pub-top"><span class="label">Publicação no Instagram</span>
        <div class="seg" role="group" aria-label="Situação da publicação">${[["","Não agendado"],["agendado","Agendado"],["publicado","Publicado"]].map(([k,t])=>`<button type="button" data-act="pub-st" data-id="${p.id}" data-st="${k}" aria-pressed="${pub===k}">${t}</button>`).join("")}</div></div>
      ${pub==="agendado"?`<div class="pub-campo"><label class="label" for="pa-${p.id}">Dia e hora agendados</label><input type="datetime-local" id="pa-${p.id}" data-pub-in="${p.id}" value="${localDT(p.agendado_para)}"></div>`:""}
      ${pub==="publicado"?`<div class="pub-campo"><label class="label" for="pu-${p.id}">Link do post no Instagram (opcional)</label><input type="url" id="pu-${p.id}" data-pub-in="${p.id}" value="${esc(p.publicado_url||"")}" placeholder="https://www.instagram.com/p/…"></div>`:""}
      <div class="actions">${st!=="ok"&&pub!=="publicado"?`<span class="note">O cliente ainda não aprovou este post.</span>`:""}
        <button type="button" class="btn small ghost" data-act="pub-copiar" data-id="${p.id}">Copiar legenda</button>
        <a class="btn small outline" href="https://business.facebook.com/latest/content_calendar" target="_blank" rel="noopener">Agendar no Meta Business Suite ↗</a></div>
    </div>`}
  const ehVideo=u=>/\.(mp4|mov|webm|m4v)(\?|#|$)/i.test(u||"");
  const lerPost=id=>({titulo:$("#pt-"+id).value.trim()||"Post sem título",formato:$("#pf-"+id).value,data:$("#pd-"+id).value||null,
    dia:$("#pn-"+id).value===""?null:+$("#pn-"+id).value,legenda:$("#pl-"+id).value});
  async function atualizarPost(id,campos,msg){
    const {data,error}=await sb.from("posts").update(campos).eq("id",id).select().single();
    if(error)return falha("salvar o post",error);
    const i=posts.findIndex(p=>p.id===id);posts[i]=data;render();if(msg)toast(msg);
  }
  async function enviarTelas(id,files){
    const p=posts.find(x=>x.id===id);const urls=[];
    for(const [k,f] of [...files].entries()){
      const lim=/^video\//.test(f.type)?50:15;if(f.size>lim*1024*1024){toast(f.name+" passa de "+lim+" MB e foi ignorado. "+(lim===50?"Exporte o vídeo em MP4 com menos peso.":""));continue}
      toast(/^video\//.test(f.type)?`Enviando o vídeo (${Math.round(f.size/1048576)} MB)… não feche a página.`:`Enviando tela ${k+1} de ${files.length}…`);

  async function salvarChecklist(id,lista,msgExtra){
    const x=pedidos.find(p=>p.id===id);if(!x)return;
    const f=lista.filter(i=>i.ok).length, campos={checklist:lista};
    let msg=msgExtra||"Checklist salvo. O cliente acompanha o andamento.";
    const iAp=lista.findIndex(i=>/aprova/i.test(i.t)), apOk=iAp>=0&&lista[iAp].ok;
    if(x.status==="recusado"){}
    else if(lista.length&&f===lista.length&&x.status!=="concluido"){
      if(x.aprovado_cliente_em||iAp<0){campos.status="concluido";msg="Todas as etapas feitas: pedido concluído."}
      else if(x.status!=="aprovacao"){campos.status="aprovacao";msg="Enviado para o cliente aprovar no portal."}}
    else if(apOk&&!["aprovacao","concluido"].includes(x.status)&&!x.aprovado_cliente_em){campos.status="aprovacao";msg="Enviado para o cliente aprovar no portal. Ele recebe o aviso no sino."}
    else if(!apOk&&x.status==="aprovacao"){campos.status="producao";msg="Voltou para produção."}
    else if(f>0&&x.status==="recebido"){campos.status="producao";msg="Pedido em produção. O cliente vê o andamento."}
    else if(f<lista.length&&x.status==="concluido"){campos.status="producao"}
    const {data,error}=await sb.from("pedidos").update(campos).eq("id",id).select().single();
    if(error){render();return falha("salvar o checklist",error)}
    if(data.status==="concluido"&&pedFiltro==="abertos")pedFiltro="todos"; // o pedido concluído continua à vista
    pedidos[pedidos.findIndex(p=>p.id===id)]=data;render();toast(msg);if(campos.status)carregarAlertas();
  }

    if(a==="copiar"){const t=portalURL(cliAtual.token);try{await navigator.clipboard.writeText(t);toast("Link copiado.")}catch(err){const r=document.createRange();r.selectNodeContents($("#link"));getSelection().removeAllRanges();getSelection().addRange(r);toast("Selecionei o link: copie com Ctrl+C.")}return}
    if(a==="salvar-cliente"){const lim={};document.querySelectorAll("[data-lim]").forEach(el=>{if(el.value!=="")lim[el.dataset.lim]=Math.max(0,parseInt(el.value,10)||0)});
      const {data,error}=await sb.from("clientes").update({nome:$("#cl-nome").value.trim()||cliAtual.nome,cor_destaque:$("#cl-cor").value.trim(),plano_nome:$("#cl-plano").value.trim(),limites:lim,regra_extra:$("#cl-regra").value.trim(),whatsapp:$("#cl-wa").value.trim()}).eq("id",cliAtual.id).select().single();if(error)return falha("salvar o cliente",error);Object.assign(cliAtual,data);renderClientes();render();toast("Cliente salvo.");return}
    if(a==="add-acesso"){const email=$("#ac-email").value.trim().toLowerCase(),nome=$("#ac-nome").value.trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast("Digite um e-mail válido.");return}
      if(acessos.some(u=>u.email===email)){toast("Este e-mail já tem acesso.");return}
      const {data,error}=await sb.from("cliente_usuarios").insert({cliente_id:cliAtual.id,email,nome}).select().single();if(error)return falha("liberar o acesso",error);
      acessos.push(data);render();toast("Acesso liberado. Agora copie o convite e envie para "+(nome||email)+".");return}
    if(a==="rm-acesso"){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Confirmar";return}
      const em=b.dataset.email;const {error}=await sb.from("cliente_usuarios").delete().eq("cliente_id",cliAtual.id).eq("email",em);if(error)return falha("remover",error);
      acessos=acessos.filter(u=>u.email!==em);render();toast("Acesso removido. Essa pessoa não vê mais este cliente.");return}
    if(a==="senha-temp"){abrirSenhaTemp(acessos.find(u=>u.email===b.dataset.email));return}
    if(a==="copiar-convite"){const nomes=acessos.map(u=>u.nome||u.email);
      const t=`Olá${nomes.length===1?", "+nomes[0]:""}! Seu acesso ao ${cfg.plataforma||"Hub de Marketing"} da ${cfg.marca||"GUXTA"} está liberado.\n\n1. Acesse: ${loginURL()}\n2. Clique em “Primeiro acesso? Criar minha senha”\n3. Use o e-mail ${acessos.length===1?acessos[0].email:"que você nos passou"} e crie sua senha\n4. Confirme pelo e-mail que vai chegar e pronto!\n\nLá você aprova os conteúdos do mês, vê os roteiros, acompanha os resultados e faz pedidos.`;
      try{await navigator.clipboard.writeText(t);toast("Convite copiado. Cole no WhatsApp ou no e-mail.")}catch(err){prompt("Copie o convite:",t)}return}
    if(a==="pausar"){const {data,error}=await sb.from("clientes").update({ativo:!cliAtual.ativo}).eq("id",cliAtual.id).select().single();if(error)return falha("mudar o link",error);Object.assign(cliAtual,data);renderClientes();render();toast(data.ativo?"Cliente reativado: o acesso voltou.":"Cliente desativado. O histórico continua guardado.");return}
    if(a==="excluir-cliente"){
      const nome=cliAtual.nome;
      const digitado=prompt(`Excluir "${nome}" apaga para sempre todos os meses, posts, aprovações, roteiros, pedidos, números, anúncios, acessos, artes e contratos deste cliente.\n\nSe ele só encerrou o contrato, use "Desativar cliente": guarda o histórico.\n\nPara excluir mesmo assim, digite o nome do cliente:`);
      if(digitado===null)return;
      if(digitado.trim().toLowerCase()!==nome.trim().toLowerCase()){toast("O nome não confere. Nada foi excluído.");return}
      toast("Excluindo…");
      // apaga as artes do cliente no armazenamento (pasta com o id dele)
      try{const st=sb.storage.from("artes");const pastas=(await st.list(cliAtual.id,{limit:1000})).data||[];
        for(const pz of pastas){const arqs=(await st.list(cliAtual.id+"/"+pz.name,{limit:1000})).data||[];
          if(arqs.length)await st.remove(arqs.map(a=>cliAtual.id+"/"+pz.name+"/"+a.name));}}catch(e){console.warn(e)}
      // e os documentos (contrato)
      try{const docsArq=(await sb.storage.from("documentos").list(cliAtual.id,{limit:1000})).data||[];
        if(docsArq.length)await sb.storage.from("documentos").remove(docsArq.map(a=>cliAtual.id+"/"+a.name));}catch(e){console.warn(e)}
      const {error}=await sb.from("clientes").delete().eq("id",cliAtual.id);
      if(error)return falha("excluir o cliente",error);
      clientes=clientes.filter(x=>x.id!==cliAtual.id);cliAtual=null;cicloAtual=null;renderClientes();render();toast(`${nome} foi excluído.`);return}
    if(a==="enviar-doc"){enviarDocumento(b);return}
    if(a==="abrir-doc"){const d=documentos.find(x=>x.id===id);if(!d)return;const janela=window.open("","_blank");
      const {data,error}=await sb.storage.from("documentos").createSignedUrl(d.caminho,600);
      if(error){janela&&janela.close();return falha("abrir o documento",error)}
      if(janela)janela.location.href=data.signedUrl;else location.href=data.signedUrl;return}
    if(a==="apagar-doc"){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Clique de novo para apagar";return}
      const d=documentos.find(x=>x.id===id);if(!d)return;
      const {error}=await sb.from("documentos").delete().eq("id",id);if(error)return falha("apagar o documento",error);
      await sb.storage.from("documentos").remove([d.caminho]);
      documentos=documentos.filter(x=>x.id!==id);render();toast("Documento apagado.");return}
    if(a==="novo-link"){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Clique de novo para confirmar";return}
      const novo=crypto.randomUUID().replace(/-/g,"")+crypto.randomUUID().replace(/-/g,"");
      const {data,error}=await sb.from("clientes").update({token:novo}).eq("id",cliAtual.id).select().single();if(error)return falha("gerar o link",error);Object.assign(cliAtual,data);render();toast("Link novo gerado. Envie para o cliente.");return}
    if(a==="novo-ciclo"){
      const anterior=cicloAtual;
      const {data,error}=await sb.from("ciclos").insert({cliente_id:cliAtual.id,titulo:"Novo mês",dicas_reels:anterior?anterior.dicas_reels:[],dicas_stories:anterior?anterior.dicas_stories:[],metricas:{inicio:anterior&&anterior.metricas&&anterior.metricas.fim?anterior.metricas.fim:{},fim:{},obs:""}}).select().single();
      if(error)return falha("criar o mês",error);cicloAtual=data;aba="posts";await abrirCliente(cliAtual.id);toast("Mês criado como rascunho. Dicas e números finais do mês anterior já vieram copiados.");return}
    if(!cicloAtual)return;
    if(a==="salvar-ciclo"){const {data,error}=await sb.from("ciclos").update({titulo:$("#ci-titulo").value.trim()||"Mês",inicio:$("#ci-inicio").value||null,fim:$("#ci-fim").value||null}).eq("id",cicloAtual.id).select().single();if(error)return falha("salvar o mês",error);Object.assign(cicloAtual,data);render();toast("Mês salvo.");return}
    if(a==="publicar"){const {data,error}=await sb.from("ciclos").update({publicado:!cicloAtual.publicado}).eq("id",cicloAtual.id).select().single();if(error)return falha("publicar",error);Object.assign(cicloAtual,data);render();toast(data.publicado?"Publicado: o cliente já vê este mês.":"Voltou para rascunho.");return}
    if(a==="apagar-ciclo"){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Apaga tudo deste mês. Clique de novo";return}
      const {error}=await sb.from("ciclos").delete().eq("id",cicloAtual.id);if(error)return falha("apagar o mês",error);cicloAtual=null;await abrirCliente(cliAtual.id);toast("Mês apagado.");return}
    const proximoNum=()=>posts.reduce((m,p)=>Math.max(m,p.dia||0),0)+1;
    if(a==="novo-reels"){const {data,error}=await sb.from("posts").insert({ciclo_id:cicloAtual.id,titulo:"Novo Reels",formato:"Reels",dia:proximoNum()}).select().single();if(error)return falha("criar o Reels",error);posts.push(data);render();document.getElementById("post-"+data.id)?.scrollIntoView({block:"start"});return}
    if(a==="novo-post"){const {data,error}=await sb.from("posts").insert({ciclo_id:cicloAtual.id,titulo:"Novo post",dia:proximoNum()}).select().single();if(error)return falha("criar o post",error);posts.push(data);render();document.getElementById("post-"+data.id)?.scrollIntoView({block:"start"});return}
    if(a==="salvar-post")return atualizarPost(id,lerPost(id),"Post salvo.");
    if(a==="apagar-post"){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Clique de novo para apagar";return}
      const {error}=await sb.from("posts").delete().eq("id",id);if(error)return falha("apagar o post",error);posts=posts.filter(p=>p.id!==id);render();toast("Post apagado.");return}
    if(a==="sl-esq"||a==="sl-dir"||a==="sl-del"){const p=posts.find(x=>x.id===id),i=+b.dataset.i,s=[...p.slides];
      if(a==="sl-del")s.splice(i,1);else{const j=a==="sl-esq"?i-1:i+1;[s[i],s[j]]=[s[j],s[i]]}
      return atualizarPost(id,{slides:s},a==="sl-del"?"Tela removida.":"Ordem atualizada.")}
    // roteiros
    const rc=b.closest("[data-rot]"), sc=b.closest("[data-sto]");
    if(a==="novo-roteiro"){const {data,error}=await sb.from("roteiros").insert({ciclo_id:cicloAtual.id,titulo:"Novo Reels",blocos:[{tempo:"0–3 s",fala:"",tela:""}]}).select().single();if(error)return falha("criar o roteiro",error);roteiros.push(data);render();return}
    if(a==="novo-story"){const {data,error}=await sb.from("stories").insert({ciclo_id:cicloAtual.id,titulo:"Novos Stories",telas:[{texto:"",recurso:""}]}).select().single();if(error)return falha("criar os Stories",error);stories.push(data);render();return}
    if(a==="add-bloco"&&rc){rc.querySelector("[data-blocos]").insertAdjacentHTML("beforeend",blocoRow({}));return}
    if(a==="add-tela"&&sc){sc.querySelector("[data-telas]").insertAdjacentHTML("beforeend",telaRow({}));return}
    if(a==="rm-row"){b.closest("[data-row]").remove();return}
    if(a==="salvar-roteiro"&&rc){const campos=Object.assign(lerCampos(rc),{blocos:lerLinhas(rc.querySelector("[data-blocos]"),["tempo","fala","tela"])});
      const {data,error}=await sb.from("roteiros").update(campos).eq("id",rc.dataset.rot).select().single();if(error)return falha("salvar o roteiro",error);roteiros[roteiros.findIndex(x=>x.id===data.id)]=data;render();toast("Roteiro salvo.");return}
    if(a==="apagar-roteiro"&&rc){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Clique de novo para apagar";return}
      const {error}=await sb.from("roteiros").delete().eq("id",rc.dataset.rot);if(error)return falha("apagar",error);roteiros=roteiros.filter(x=>x.id!==rc.dataset.rot);render();return}
    if(a==="salvar-story"&&sc){const campos=Object.assign(lerCampos(sc),{telas:lerLinhas(sc.querySelector("[data-telas]"),["texto","recurso"])});
      const {data,error}=await sb.from("stories").update(campos).eq("id",sc.dataset.sto).select().single();if(error)return falha("salvar os Stories",error);stories[stories.findIndex(x=>x.id===data.id)]=data;render();toast("Stories salvos.");return}
    if(a==="apagar-story"&&sc){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Clique de novo para apagar";return}
      const {error}=await sb.from("stories").delete().eq("id",sc.dataset.sto);if(error)return falha("apagar",error);stories=stories.filter(x=>x.id!==sc.dataset.sto);render();return}
    const pc=b.closest("[data-ped]");
    if(a==="ped-ck-add"&&pc){const i=pc.querySelector("[data-ped-ck-novo]"),v=i.value.trim();if(!v){i.focus();return}return salvarChecklist(pc.dataset.ped,[...lerCk(pc),{t:v,ok:false}],"Etapa adicionada.")}
    if(a==="ped-ck-rm"&&pc){const l=lerCk(pc);l.splice(+b.dataset.k,1);return salvarChecklist(pc.dataset.ped,l,"Etapa removida.")}
    if(a==="ped-ck-padrao"&&pc){const x=pedidos.find(p=>p.id===pc.dataset.ped);return salvarChecklist(pc.dataset.ped,(ETAPAS_PED[x.tipo]||ETAPAS_PED.Outro).map(t=>({t,ok:false})),"Etapas padrão adicionadas.")}
    if(a==="salvar-pedido"&&pc){const v=k=>pc.querySelector(`[data-pf="${k}"]`).value;
      const {data,error}=await sb.from("pedidos").update({status:v("status"),extra:v("extra")==="true",resposta:v("resposta").trim(),atualizado_em:new Date().toISOString()}).eq("id",pc.dataset.ped).select().single();
      if(error)return falha("salvar o pedido",error);pedidos[pedidos.findIndex(x=>x.id===data.id)]=data;render();carregarAlertas();toast("Pedido atualizado. O cliente já vê o status e a resposta.");return}
    if(a==="apagar-pedido"&&pc){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Clique de novo para apagar";return}
      const {error}=await sb.from("pedidos").delete().eq("id",pc.dataset.ped);if(error)return falha("apagar o pedido",error);pedidos=pedidos.filter(x=>x.id!==pc.dataset.ped);render();carregarAlertas();toast("Pedido apagado.");return}
    if(a==="salvar-relatorio"||a==="abrir-relatorio"){
      let janela=null;if(a==="abrir-relatorio"){e.preventDefault();janela=window.open("","_blank");}
      const destino="relatorio.html?ciclo="+encodeURIComponent(cicloAtual.id);
      const campos={relatorio_resumo:$("#rl-resumo").value.trim(),relatorio_proximos:$("#rl-prox").value.trim()};
      if(campos.relatorio_resumo!==(cicloAtual.relatorio_resumo||"")||campos.relatorio_proximos!==(cicloAtual.relatorio_proximos||"")){
        const {data,error}=await sb.from("ciclos").update(campos).eq("id",cicloAtual.id).select().single();if(error){janela&&janela.close();return falha("salvar o relatório",error)}Object.assign(cicloAtual,data);
        if(a==="salvar-relatorio")toast("Textos salvos.");}
      else if(a==="salvar-relatorio")toast("Nada novo para salvar.");
      if(a==="abrir-relatorio"){if(janela)janela.location.href=destino;else location.href=destino}
      return}
    if(a==="rl-auto"){if(!window.GlaraAvisos)return;const r=window.GlaraAvisos.rascunhoRelatorio({ciclo:cicloAtual,posts,decisoes,roteiros,stories,pedidos,anuncios});
      const tr=$("#rl-resumo"), tp=$("#rl-prox");
      if((tr.value.trim()||tp.value.trim())&&b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Clique de novo para substituir o texto";return}
      tr.value=r.resumo;tp.value=r.proximos;b.dataset.confirm="";b.textContent="Gerar rascunho automático";tr.focus();toast("Rascunho pronto. Revise, complete o destaque do mês e clique em Salvar textos.");return}
    if(a==="rl-sem-wa"){const det=$("#cl-config");if(det){det.open=true;$("#cl-wa").focus();$("#cl-wa").scrollIntoView({block:"center"})}toast("Preencha o WhatsApp do cliente e clique em Salvar.");return}
    if(a==="rl-wa"){if(b.getAttribute("aria-disabled")==="true"){e.preventDefault();toast("Publique o mês e marque “Mostrar o relatório” antes de enviar.");return}
      sb.from("ciclos").update({relatorio_enviado_em:new Date().toISOString()}).eq("id",cicloAtual.id).select().single().then(({data})=>{if(data){Object.assign(cicloAtual,data);render()}});return}
    if(a==="rl-email"){b.disabled=true;
      const campos={relatorio_resumo:$("#rl-resumo").value.trim(),relatorio_proximos:$("#rl-prox").value.trim()};
      if(campos.relatorio_resumo!==(cicloAtual.relatorio_resumo||"")||campos.relatorio_proximos!==(cicloAtual.relatorio_proximos||"")){
        const sv=await sb.from("ciclos").update(campos).eq("id",cicloAtual.id).select().single();if(sv.error){b.disabled=false;return falha("salvar o relatório",sv.error)}Object.assign(cicloAtual,sv.data)}
      const {data,error}=await sb.rpc("relatorio_enviar",{p_ciclo:cicloAtual.id});b.disabled=false;
      if(error)return falha("enviar o relatório",error);
      cicloAtual.relatorio_enviado_em=new Date().toISOString();render();
      toast(data&&data.email_ativo?`Relatório enviado para ${data.emails} pessoa(s).`:"Relatório na fila: ele sai assim que o e-mail estiver ligado em Avisos e lembretes.");return}
    if(a==="imp-ok"){b.disabled=true;await impGravar();return}
    if(a==="imp-cancelar"){impPrev=null;render();return}
    if(a==="pub-st"){const p=posts.find(x=>x.id===id);if(!p)return;const st=b.dataset.st;
      const campos={publicacao:st,publicacao_em:st?new Date().toISOString():null};
      if(st==="agendado"&&!p.agendado_para&&p.data)campos.agendado_para=new Date(p.data+"T18:00").toISOString();
      const {data,error}=await sb.from("posts").update(campos).eq("id",id).select().single();if(error)return falha("marcar a publicação",error);
      Object.assign(p,data);render();toast(st==="agendado"?"Marcado como agendado. O cliente vê no portal.":st==="publicado"?"Marcado como publicado.":"Publicação desmarcada.");return}
    if(a==="pub-copiar"){const p=posts.find(x=>x.id===id);try{await navigator.clipboard.writeText(p.legenda||"");toast("Legenda copiada. Cole no Meta Business Suite.")}catch(_){toast("Não deu para copiar: selecione a legenda no campo.")}return}
    if(a==="add-anuncio"){const GA=window.GlaraAnuncios,v=x=>$(x).value;
      const row={ciclo_id:cicloAtual.id,data:v("#ad-data"),campanha:v("#ad-camp").trim(),investimento:GA.parseMoeda(v("#ad-inv")),impressoes:GA.parseInteiro(v("#ad-imp")),alcance:GA.parseInteiro(v("#ad-alc")),cliques:GA.parseInteiro(v("#ad-cli")),resultados:GA.parseInteiro(v("#ad-res")),tipo_resultado:v("#ad-tipo").trim()||"Resultados",receita:GA.parseMoeda(v("#ad-rec"))};
      if(!row.data||!row.campanha){toast("Preencha o dia e o nome da campanha.");return}
      const {data,error}=await sb.from("anuncios").insert(row).select().single();if(error)return falha("lançar",error);
      anuncios.push(data);anuncios.sort((x,y)=>String(x.data).localeCompare(String(y.data)));render();toast(`Lançado: ${row.campanha} em ${row.data.split("-").reverse().slice(0,2).join("/")}.`);$("#ad-inv")&&$("#ad-inv").focus();return}
    if(a==="apagar-anuncio"){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Apagar?";return}
      const {error}=await sb.from("anuncios").delete().eq("id",id);if(error)return falha("apagar",error);anuncios=anuncios.filter(x=>x.id!==id);render();toast("Lançamento apagado.");return}
    if(a==="salvar-numeros"){const GM=window.GlaraMetricas,ini={},fim={};
      document.querySelectorAll("[data-mi]").forEach(el=>{const v=GM.parse(el.value);if(v!=null)ini[el.dataset.mi]=v});
      document.querySelectorAll("[data-mf]").forEach(el=>{const v=GM.parse(el.value);if(v!=null)fim[el.dataset.mf]=v});
      const {data,error}=await sb.from("ciclos").update({metricas:{inicio:ini,fim:fim,obs:$("#m-obs").value.trim()},mostrar_resultados:$("#m-mostrar").checked}).eq("id",cicloAtual.id).select().single();
      if(error)return falha("salvar os números",error);Object.assign(cicloAtual,data);const k=ciclos.findIndex(x=>x.id===data.id);if(k>=0)ciclos[k]=cicloAtual;render();toast("Números salvos.");return}
    if(a==="salvar-dicas"){const lin=id=>$(id).value.split("\n").map(s=>s.trim()).filter(Boolean);
      const {data,error}=await sb.from("ciclos").update({dicas_reels:lin("#d-reels"),dicas_stories:lin("#d-stories")}).eq("id",cicloAtual.id).select().single();if(error)return falha("salvar as dicas",error);Object.assign(cicloAtual,data);render();toast("Dicas salvas.");return}
  });

  document.addEventListener("keydown",e=>{if(e.target.dataset&&e.target.dataset.pedCkNovo!=null&&e.key==="Enter"){e.preventDefault();const b=e.target.closest("[data-ped]").querySelector('[data-act="ped-ck-add"]');b&&b.click()}});
  document.addEventListener("submit",async e=>{
    if(e.target.id!=="rp-form")return;e.preventDefault();
    const v=x=>$(x).value, tipo=v("#rp-tipo"), titulo=v("#rp-titulo").trim(), link=v("#rp-link").trim(), ciclo=v("#rp-ciclo")||(cicloAtual&&cicloAtual.id)||null;
    if(!titulo){toast("Escreva o que foi pedido.");$("#rp-titulo").focus();return}
    if(link&&!linkSeguro(link)){toast("O link precisa começar com https://");$("#rp-link").focus();return}
    let extra=v("#rp-cobranca")==="extra";
    if(v("#rp-cobranca")==="auto"){const lim=(cliAtual.limites||{})[tipo];
      if(tipo==="Outro")extra=true;else if(typeof lim==="number"&&cicloAtual&&ciclo===cicloAtual.id)extra=usoPlano()[tipo]+1>lim;}
    const {data:{session}}=await sb.auth.getSession();
    const row={cliente_id:cliAtual.id,ciclo_id:ciclo,tipo,titulo,descricao:v("#rp-desc").trim(),prazo:v("#rp-prazo")||null,link,nome:v("#rp-nome").trim(),
      extra,status:"recebido",resposta:"",origem:v("#rp-origem"),registrado_por:session?session.user.email:"",checklist:(ETAPAS_PED[tipo]||ETAPAS_PED.Outro).map(t=>({t,ok:false}))};
    const {data,error}=await sb.from("pedidos").insert(row).select().single();
    if(error)return falha("registrar o pedido",error);
    pedidos.unshift(data);pedFiltro="abertos";render();carregarAlertas();
    toast(`Pedido registrado${extra?" como extra":""}. O cliente já vê na aba Pedidos.`);
    document.querySelector(`[data-ped="${data.id}"]`)?.scrollIntoView({block:"center"});
  });

  iniciar();
})();
</script>
<script src="ajuste-cores.js"></script>
</body>
</html>
